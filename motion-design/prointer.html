   PRO-INTER — « L'histoire de Pro » — 42 s, 9:16, un seul plan qui défile.
   Le « O » du logo (la cible) saute hors du logo et devient Pro, le petit
   bonhomme qui accompagne un intérimaire : écoute, viseur sur la bonne

const Q = new URLSearchParams(location.search);

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;

/* ---------------------------- décor lointain (parallaxe) ---------------------------- */
(function skyline() {
  const r = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
  let x = -600;
  while (x < 12500) { const w = 90 + r() * 140, h = 160 + r() * 380; el("rect", { x, y: GY - h - 40, width: w, height: h + 40, rx: 6, fill: r() > .7 ? "#E3EEF3" : "#E9EFF3" }, FAR);

el("rect", { x: -3000, y: GY, width: 18000, height: 1200, fill: C.ground });
el("line", { x1: -3000, y1: GY, x2: 15000, y2: GY, stroke: C.line, "stroke-width": 4 });

/* ---------------------------- logo vectorisé ---------------------------- */
const LD = window.LOGO_DATA, OL = LD.O;
function makeLogo(x, y, k) {
  const g = el("g", { transform: `translate(${x},${y}) scale(${k})` }), parts = { P: [], R: [], bar: [], Inter: [], tagline: [] };
  LD.paths.forEach(p => { const e = el("path", { d: p.d, "fill-rule": "evenodd", fill: p.g === "Inter" ? C.cyan : p.g === "tagline" ? LD.tag : C.grey }, g); parts[p.g].push({ e, box: p.box }); });
  // emplacement de la cible (pointillés quand Pro est sorti du logo)
  const slot = el("circle", { cx: OL.cx, cy: OL.cy, r: OL.r, fill: "none", stroke: C.cyan, "stroke-width": 5, "stroke-dasharray": "14 12", opacity: 0 }, g);
  return { g, parts, slot, x, y, k, O: [x + OL.cx * k, y + OL.cy * k], r: OL.r * k };
}
const LOGO1 = makeLogo(100, 600, 0.99), LOGO2 = makeLogo(9860, 560, 0.99);
// assemblage du logo : lettres qui glissent, barre qui pousse, « Inter » qui rebondit, slogan qui se dévoile
function animLogo(L, t, t0, slotA) {
  L.parts.P.forEach(o => set(o.e, { opacity: prog(t, t0, t0 + .35), transform: `translate(${(1 - E.out(prog(t, t0, t0 + .55))) * -90},0)` }));
  L.parts.R.forEach(o => set(o.e, { opacity: prog(t, t0 + .12, t0 + .47), transform: `translate(${(1 - E.out(prog(t, t0 + .12, t0 + .67))) * -90},0)` }));
  L.parts.bar.forEach(o => { const u = E.out(prog(t, t0 + .6, t0 + 1.0)); set(o.e, { opacity: u > 0 ? 1 : 0, transform: `scale(1,${Math.max(.001, u)})`, "transform-origin": `${(o.box[0] + o.box[2]) / 2} ${o.box[1]}` }); });
  const base = Math.max(...L.parts.Inter.map(o => o.box[3]));
  L.parts.Inter.forEach((o, i) => { const u = pop(t, t0 + .8 + i * .08, .5), cx = (o.box[0] + o.box[2]) / 2; set(o.e, { opacity: clamp(u * 3), transform: `translate(${cx},${base}) scale(${Math.max(.001, u)}) translate(${-cx},${-base})` }); });
  const tg = prog(t, t0 + 1.3, t0 + 1.9), tx0 = Math.min(...L.parts.tagline.map(o => o.box[0])), tx1 = Math.max(...L.parts.tagline.map(o => o.box[2]));

  set(L.slot, { opacity: slotA, "stroke-dashoffset": -t * 30 });
}

/* ---------------------------- Pro : la cible devient un bonhomme ---------------------------- */
const PRO = (() => {
  const g = el("g");
  const shadow = el("ellipse", { rx: 80, ry: 14, fill: "#2F3437", opacity: .12 }, g);
  const legs = [0, 1].map(() => el("line", { stroke: C.grey, "stroke-width": 18, "stroke-linecap": "round" }, g));
  const shoes = [0, 1].map(() => el("ellipse", { rx: 20, ry: 11, fill: C.grey }, g));
  const body = el("rect", { fill: C.cyan, rx: 34 }, g);
  const out = [0, 1, 2, 3].map(() => el("line", { stroke: C.grey, "stroke-linecap": "round" }, g));   // droite, gauche, bas, haut

  const ball = el("circle", { fill: C.cyan }, g);
  const ring = el("circle", { fill: "none", stroke: C.grey }, g);
  const face = el("circle", { fill: "#FFFFFF" }, g);

  const mouth = el("path", { fill: "none", stroke: C.grey, "stroke-linecap": "round" }, g);
  const scan = el("circle", { fill: "none", stroke: C.cyan, "stroke-width": 6, filter: "url(#glow)" }, g);
  const clip = el("g", {}, g); el("rect", { x: -26, y: -34, width: 52, height: 68, rx: 6, fill: "#FFFFFF", stroke: C.grey, "stroke-width": 5 }, clip);
  [-12, 0, 12].forEach(dy => el("line", { x1: -14, y1: dy + 4, x2: 14, y2: dy + 4, stroke: C.cyan, "stroke-width": 4, "stroke-linecap": "round" }, clip)); el("rect", { x: -12, y: -40, width: 24, height: 10, rx: 4, fill: C.grey }, clip);

const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
// géométrie du bonhomme (pieds en x,y ; échelle s ; f = 1 regarde à droite)
function mascot(x, y, s, f, o) {
  const ph = o.walk || 0, amp = o.walkAmp ?? 0, bob = -Math.abs(Math.sin(ph)) * 10 * amp * s;

// m = 0 : la cible du logo (centre C0, rayon r0) ; m = 1 : le bonhomme ; la tête suit un arc entre les deux
function drawPro(st) {

  [0, 1].forEach(i => { const p = mix(tL(DIRS[i])[1], tgt[i][1], ue[i]); set(PRO.hands[i], { cx: p[0], cy: p[1], r: 13 * s * prog(m, .6, .9) }); });
  { const p = mix(tL(DIRS[3])[1], tgt[3][1], ue[3]); set(PRO.ball, { cx: p[0], cy: p[1], r: 10 * s * prog(m, .45, .75) }); }
  // repères intérieurs → yeux, bouche ; ils reviennent en mode « viseur »
  const iL = d => [[C0[0] + d[0] * r0 * OL.tick_r0 / OL.r, C0[1] + d[1] * r0 * OL.tick_r0 / OL.r], [C0[0] + d[0] * r0 * OL.r_in / OL.r, C0[1] + d[1] * r0 * OL.r_in / OL.r]];
  const eyeY = M.head[1] - 10 * s, eo = 6 * s * f, eh = 9 * s * (1 - blink * .9);
  const eyes = [[[M.head[0] + 21 * s + eo, eyeY - eh / 2], [M.head[0] + 21 * s + eo, eyeY + eh / 2]], [[M.head[0] - 21 * s + eo, eyeY - eh / 2], [M.head[0] - 21 * s + eo, eyeY + eh / 2]]];

/* ---------------------------- légendes ---------------------------- */
const TEXTS = [];

const CAPS = [

  [0, 540, CY(1.1), 1.1], [3.6, 540, CY(1.1), 1.1], [5.0, 570, CY(1.4), 1.4, "inOut"], [5.3, 590, CY(1.4), 1.4], [6.7, 1900, CY(1.4), 1.4, "inOut"], [10.2, 1910, CY(1.4), 1.4],
  [11.8, 3310, CY(1.3), 1.3, "inOut"], [16.0, 3320, CY(1.3), 1.3], [17.2, 4700, CY(1.15), 1.15, "inOut"], [19.6, 4700, CY(1.15), 1.15], [20.1, 4700, CY(1.15) - 10, 1.2, "inOut"], [21.6, 4700, CY(1.15) - 6, 1.18],
  [22.6, 6100, CY(1.3), 1.3, "inOut"], [31.3, 6110, CY(1.3), 1.3], [32.4, 8955, CY(1.1), 1.1, "inOut"], [35.9, 8965, CY(1.1), 1.1], [37.0, 10300, CY(1.1), 1.1, "inOut"], [42, 10300, CY(1.1), 1.1],

function camera(t) { let i = 0; while (i < CAM.length - 2 && t > CAM[i + 1][0]) i++; const a = CAM[i], b = CAM[i + 1]; let u = prog(t, a[0], b[0]); u = b[4] ? E[b[4]](u) : u; return { x: lerp(a[1], b[1], u), y: lerp(a[2], b[2], u), z: lerp(a[3], b[3], u) }; }

/* ---------------------------- trajectoire de Pro ---------------------------- */
// [t, x, posture] ; entre deux points Pro marche (ou court) et ses jambes suivent la distance parcourue
const PATH = [[3.5, 540], [5.2, 540], [6.75, 1700], [7.3, 1740], [10.2, 1740], [11.9, 3470], [21.5, 3470], [26.8, 5400], [27.8, 5850], [31.3, 5850], [35.0, 5850], [35.01, 9450], [36.95, 10080], [37.15, 10120]];
function proX(t) { let i = 0; while (i < PATH.length - 2 && t > PATH[i + 1][0]) i++; const a = PATH[i], b = PATH[i + 1]; const u = prog(t, a[0], b[0]); return lerp(a[1], b[1], (b[1] - a[1]) > 1200 ? u : E.sine(u)); }
function walkPhase(t) { let d = 0, prev = proX(0); for (let s = 0.02; s <= t; s += 0.02) { const x = proX(s); d += Math.abs(x - prev); prev = x; } return d / 70; }
function speed(fn, t) { return Math.abs(fn(t + .03) - fn(t - .03)) / .06; }
const CPATH = [[0, 2060], [10.3, 2060], [11.9, 3150], [99, 3150]];
function candX(t) { let i = 0; while (i < CPATH.length - 2 && t > CPATH[i + 1][0]) i++; const a = CPATH[i], b = CPATH[i + 1]; return lerp(a[1], b[1], E.sine(prog(t, a[0], b[0]))); }
const blinkAt = (t, seed) => { const p = (t + seed) % 3.7; return p < .14 ? Math.sin(p / .14 * Math.PI) : 0; };

/* ---------------------------- rendu ---------------------------- */
function seek(t) {
  const c = camera(t);
  set(WORLD, { transform: `translate(${W / 2},${H / 2}) scale(${c.z}) translate(${-c.x},${-c.y})` });
  set(FAR, { transform: `translate(${W / 2},${H / 2}) scale(${c.z}) translate(${-c.x * .55 - 120},${-c.y})` });

  if (t >= 37.15) { const m = 1 - E.inOut(prog(t, 37.15, 37.9)); Object.assign(st, { m, logoC: LOGO2.O, logoR: LOGO2.r, arc: 380, spin: (1 - m) * Math.PI / 2, walkAmp: 0, x: 10120 }); }
  // dessin du cercle au début : le « O » se trace avec le logo
  if (t < 1.6) st.drawO = prog(t, .95, 1.5);
  // postures
  if (t > 3.9 && t < 5.25) st.armR = Math.PI * .85 + Math.sin(t * 11) * .35;                          // salut
  if (t > 7.3 && t < 10.2) { st.armR = .9 + Math.sin(t * 5) * .15; }                                  // parle au candidat
  if (t > 12.1 && t < 16) { st.crosshair = win(t, 13.9, 14.2, 15.6, 15.9); st.armR = .5; st.armL = .5; }
  if (t > 27.8 && t < 31.3) { st.clip = prog(t, 27.6, 27.9); st.armL = .9; if (t > 28.2 && t < 29.4) st.armR = 2.6; }
  if (t > 26.6 && t < 27.9) st.clip = prog(t, 26.6, 26.9);

  if (st.drawO !== undefined) { const L = 2 * Math.PI * LOGO1.r; set(PRO.ring, { "stroke-dasharray": `${L * st.drawO} ${L}`, transform: `rotate(-90 ${LOGO1.O[0]} ${LOGO1.O[1]})` }); PRO.out.concat(PRO.inn).forEach((e, i) => e.setAttribute("opacity", pop(t, 1.25 + (i % 4) * .05, .3))); }
  else { PRO.ring.removeAttribute("stroke-dasharray"); PRO.ring.removeAttribute("transform"); PRO.out.forEach(e => e.setAttribute("opacity", 1)); [0, 1].forEach(i => PRO.inn[i].setAttribute("opacity", 1)); }
  // bulle « Bonjour ! »

  place(THINK, t, 5.9, 8.0, cx + 40, GY - 640);
  ORBIT.forEach((g, i) => { const a = t * 1.3 + i * 2 * Math.PI / ORBIT.length, u = pop(t, 6.2 + i * .12, .4) * (1 - E.in2(prog(t, 8.0, 8.3))); set(g, { opacity: clamp(u * 2), transform: `translate(${cx - 40 + Math.cos(a) * 200},${GY - 620 + Math.sin(a) * 90}) scale(${Math.max(.001, u * .9)})` }); });
  // l'écoute à l'agence

  const cvU = place(CV, t, 13.8, 15.8, 3340, 945, 0.8);

  // le viseur sur les missions
  const aimPts = [[4505, 815], [4895, 1025], [4505, 1235], [4505, 1025], [4895, 815]], ak = clamp((t - 17.4) / 2.2) * (aimPts.length - 1), ai = Math.min(aimPts.length - 2, Math.floor(ak)), au = E.inOut(ak - ai);

  CHIPS.forEach((g, i) => place(g, t, [19.75, 20.55, 21.3][i], 21.75, 4700 + (i - 1) * 230, 1385));     // sur la voix : intérim, CDD, CDI

  // le chantier
  BRICKS.forEach(b => b.e.setAttribute("opacity", clamp((t - 22.7 - b.i * .1) / .12)));
  const hit = Math.max(0, Math.sin(t * 9));
  drawCand(WORK, { x: 6150, y: GY, s: 1, f: t < 28.0 ? 1 : -1, worker: 1, tool: 1, toolRot: t < 28 ? -30 + hit * 60 : 0, armR: t < 28.1 ? 1.6 - hit * .6 : (t < 29.4 ? 2.7 : .25), blink: blinkAt(t, 2.2), vis: t > 21.4 && t < 31.6 ? 1 : 0 });
  TRADES.forEach((g, i) => place(g, t, [22.95, 23.75, 24.5, 25.4][i], 26.7, 6100, 700 + i * 120));    // sur la voix

    const lu = E.out(prog(t, t0 + .3, t0 + .65)); set(A.lab, { opacity: lu, transform: `translate(${A.lx + (1 - lu) * 40},${A.ly})` }); set(A.lead, { opacity: lu * .9, "stroke-dashoffset": -t * 20 }); });

  for (const T of TEXTS) { const outU = prog(t, T.t1, T.t1 + .4); T.spans.forEach((s, i) => { const u = prog(t, T.t0 + i * T.stag, T.t0 + i * T.stag + .55), e = E.out(u); s.style.opacity = (e * (1 - outU)).toFixed(3); s.style.transform = `translateY(${((1 - e) * 26 + outU * -12).toFixed(1)}px)`; }); }

}
