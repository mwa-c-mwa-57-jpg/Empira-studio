const TX = pick(80, 150), TY = pick(255, 760), SUBW = pick(900, 0);

      const path = new Path2D(); for (let i = 0; i < N; i++) { const x = lerp(src[i][0], dst[i][0], morph), y = lerp(src[i][1], dst[i][1], morph); i ? path.lineTo(x, y) : path.moveTo(x, y); }
      glowStroke(fx, path, fadeL, 3.4 + 2 * (1 - morph));
      if (morph > 0) spark(fx, lerp(src[N - 1][0], dst[N - 1][0], morph), lerp(src[N - 1][1], dst[N - 1][1], morph), 30 * fadeL);
    }
  }
  fx.setTransform(1, 0, 0, 1, 0, 0);
  burst(fx, W / 2, lpx(0, 900)[1], t, 22.0, 80, 900, 9);
}

function drawHud(t, c) {
  // bulles du chat
  const visible = BUBBLES.map((b, i) => ({ b, i, a: E.out(prog(t, b.t0, b.t0 + .35)) * (1 - E.out(prog(t, Math.min(b.t0 + 2.6, 9.1), Math.min(b.t0 + 2.6, 9.1) + .4))) }));
  BUBBLES.forEach((b, i) => {
    const a = visible[i].a; if (a <= 0) { b.el.style.opacity = 0; return; }
    // décalage vers le haut quand de nouvelles bulles arrivent
    let rank = 0; for (let j = i + 1; j < BUBBLES.length; j++) rank += E.out(prog(t, BUBBLES[j].t0, BUBBLES[j].t0 + .3));
    const y = BUB_Y - rank * BUB_STEP, pop = E.outBack(prog(t, b.t0, b.t0 + .35));
    b.el.style.opacity = a.toFixed(3);
    b.el.style.transform = `translate(${BUB_X}px,${y.toFixed(1)}px) scale(${(0.75 + 0.25 * pop).toFixed(3)})`;
    b.el.style.filter = a < 1 ? `blur(${((1 - a) * 6).toFixed(2)}px)` : "none";
  });
  // barre d'XP
  const show = E.out(prog(t, 15.55, 16.0)) * (1 - E.out(prog(t, 19.25, 19.6)));
  fx.setTransform(1, 0, 0, 1, 0, 0);
  if (show > 0) {
    const n = XP.levels.length, segW = (XP.x1 - XP.x0) / n, gap = 10;
    for (let i = 0; i < n; i++) {
      const [name, lt] = XP.levels[i], f = E.inOut(prog(t, lt, lt + 0.45)), x = XP.x0 + i * segW;
      fx.globalAlpha = show; fx.fillStyle = "rgba(20,15,9,.75)"; fx.strokeStyle = "rgba(201,138,46,.55)"; fx.lineWidth = 1.5;
      fx.beginPath(); fx.roundRect(x + gap / 2, XP.y, segW - gap, 14, 7); fx.fill(); fx.stroke();
      if (f > 0) { const gr = fx.createLinearGradient(x, 0, x + segW, 0); gr.addColorStop(0, "#C98A2E"); gr.addColorStop(1, "#F6D58E"); fx.fillStyle = gr; fx.shadowColor = "rgba(240,180,80,1)"; fx.shadowBlur = 16 + 20 * bell(t, lt + .4, lt + .5, lt + .9);
        fx.beginPath(); fx.roundRect(x + gap / 2, XP.y, (segW - gap) * f, 14, 7); fx.fill(); fx.shadowBlur = 0; }
      const lit = prog(t, lt + 0.35, lt + 0.5);
      XP_EL[i].style.opacity = show.toFixed(3); XP_EL[i].style.left = (x + segW / 2) + "px"; XP_EL[i].style.top = (XP.y - 36) + "px";
      XP_EL[i].style.color = lit > 0.5 ? "#F6D58E" : "#9b8f7c";
    }
    fx.globalAlpha = 1;
  } else XP_EL.forEach(el => el.style.opacity = 0);
  // LEVEL UP
  const lu = prog(t, XP.up, XP.up + 0.4), lo = 1 - E.out(prog(t, 19.35, 19.7));
  const lvA = (lu > 0 && lo > 0) ? clamp(lu * 3) * lo : 0;
  $("lvlback").style.opacity = (lvA * .9).toFixed(3);
  $("lvlback").style.background = `radial-gradient(ellipse ${pick(620, 900)}px ${pick(260, 240)}px at 50% ${pick(840, 470)}px, rgba(0,0,0,.85), rgba(0,0,0,.5) 50%, rgba(0,0,0,0) 100%)`;
  if (lu > 0 && lo > 0) { LVL.style.opacity = (clamp(lu * 3) * lo).toFixed(3); LVL.style.left = (W / 2) + "px"; LVL.style.top = pick(840, 470) + "px"; LVL.style.transform = `translate(-50%,-50%) scale(${(0.6 + 0.4 * E.outBack(lu)).toFixed(3)})`; LVL.style.letterSpacing = (0.6 - 0.28 * E.out(lu)).toFixed(3) + "em"; LVL.style.fontSize = pick(84, 96) + "px"; burst(fx, W / 2, pick(840, 470), t, XP.up, 60, 700, 21); }
  else LVL.style.opacity = 0;
}

function drawText(t) {
  for (const T of TEXTS) {
    const outU = prog(t, T.t1, T.t1 + T.out);
    T.spans.forEach((s, i) => {
      const u = prog(t, T.t0 + i * T.stag, T.t0 + i * T.stag + T.dur), e = E.out(u);
      s.style.opacity = (e * (1 - E.sine(outU))).toFixed(3);
      s.style.transform = `translateY(${((1 - e) * 34).toFixed(2)}px)`;
      const blur = (1 - E.out4(u)) * 12 + outU * 10; s.style.filter = blur > .05 ? `blur(${blur.toFixed(2)}px)` : "none";
    });
    if (T.fly) { const sc = 1 + E.in2(prog(t, 3.0, 3.6)) * 2.6, yOff = (parseFloat(T.el.style.top) - H / 2) * (sc - 1); T.el.style.transform = `translateX(-50%) translateY(${yOff.toFixed(1)}px) scale(${sc.toFixed(3)})`; }
  }
}

function drawOverlays(t, c) {
  let k = 0, bx = W / 2, by = H / 2;
  const ph = bell(t, 3.75, 4.12, 4.6); if (ph > k) { k = ph; const q = proj(c, ...SCREEN_C); if (q) { bx = q[0]; by = q[1]; } }
  const mon = bell(t, 9.35, 9.95, 10.7); if (mon > k) { k = mon; bx = W / 2; by = H / 2; }
  const st = bell(t, 19.45, 19.95, 20.55); if (st > k) { k = st; bx = W / 2; by = H / 2; }
  const R = Math.max(W, H);
  $("bloom").style.opacity = k.toFixed(3);
  $("bloom").style.background = `radial-gradient(circle ${R}px at ${bx.toFixed(0)}px ${by.toFixed(0)}px, rgba(255,248,230,1) 0%, rgba(255,226,165,.92) ${(18 + 40 * k).toFixed(0)}%, rgba(214,150,60,.55) ${(45 + 40 * k).toFixed(0)}%, rgba(120,70,20,${(.3 * k).toFixed(2)}) 100%)`;
  const lk = Math.max(bell(t, 11.4, 11.8, 12.4), bell(t, 12.8, 13.2, 13.8), bell(t, 14.6, 15.1, 15.7)) * .35, lx = ((t * 260) % (W + 700)) - 350;
  $("leak").style.opacity = lk.toFixed(3);
  $("leak").style.background = `radial-gradient(ellipse ${pick(500, 600)}px ${pick(1300, 900)}px at ${lx.toFixed(0)}px 40%, rgba(255,180,80,.55), rgba(255,140,40,0) 70%)`;
  const imp = 22.0, fl = prog(t, imp - .03, imp + .6), fa = fl > 0 && fl < 1 ? Math.pow(1 - fl, 2.2) : 0;
  $("flash").style.opacity = fa.toFixed(3);
  $("flash").style.background = `radial-gradient(circle ${R}px at ${LCX}px ${lpx(0, 900)[1].toFixed(0)}px, rgba(255,246,222,.95) 0%, rgba(240,190,100,.55) 18%, rgba(160,100,30,.12) 45%, rgba(0,0,0,0) 70%)`;
  const bh = V ? 0 : 102 * (1 - E.inOut(prog(t, 22.0, 23.2)));
  $("barT").style.height = $("barB").style.height = bh.toFixed(1) + "px";
  const sc = Math.max(...SECTIONS.map(s => bell(t, s[3] - 0.1, s[3] + 0.5, s[4] + 0.6)), bell(t, 20.2, 20.6, 21.7));
  $("scrim").style.opacity = sc.toFixed(3);
  $("topscrim").style.opacity = bell(t, 20.1, 20.6, 21.75).toFixed(3);
  $("fade").style.opacity = Math.max(1 - E.out(prog(t, 0, 1.0)), E.in(prog(t, 29.3, 30))).toFixed(3);
}

function drawLogo(t) {
  const imp = 22.0, fill = prog(t, imp - .05, imp + .14);
  LOGO.icon.style.opacity = E.out(fill).toFixed(3); LOGO.icon.style.transformOrigin = "50% 100%";
  LOGO.icon.style.transform = `scale(${(1 + .06 * (1 - E.out(prog(t, imp, imp + .8)))).toFixed(4)})`;
  const sw = prog(t, imp + .5, imp + 1.4); LOGO.sweep.style.opacity = sw > 0 && sw < 1 ? 1 : 0; LOGO.sweep.style.backgroundPosition = `${(100 - sw * 100).toFixed(2)}% 0`;
  const rev = (el, a, b, mode) => {
    const u = E.inOut(prog(t, a, b)); el.style.opacity = u > 0 ? 1 : 0;
    if (mode === "lr") { const X = -15 + u * 130; el.style.webkitMaskImage = el.style.maskImage = `linear-gradient(90deg,#000 ${X - 15}%,transparent ${X}%)`; }
    else { const X = u * 62; el.style.webkitMaskImage = el.style.maskImage = `linear-gradient(90deg,transparent ${50 - X - 12}%,#000 ${50 - X}%,#000 ${50 + X}%,transparent ${50 + X + 12}%)`; }
    el.style.transform = `translateY(${((1 - E.out(prog(t, a, b))) * 14).toFixed(2)}px)`;
  };
  rev(LOGO.empira, imp + .45, imp + 1.6, "lr"); rev(LOGO.agency, imp + 1.25, imp + 2.3, "c"); rev(LOGO.tagline, imp + 2.0, imp + 3.3, "c");
  CTA.forEach(({ el, t0 }) => { const u = E.out(prog(t, t0, t0 + 0.8)); el.style.opacity = u.toFixed(3); el.style.transform = `translateX(-50%) translateY(${((1 - u) * 18).toFixed(1)}px)`; el.style.filter = u < 1 ? `blur(${((1 - u) * 8).toFixed(2)}px)` : "none"; });
}

function drawGrain(frame) { const r = rng(frame * 7919 + 13), d = grainImg.data; for (let i = 0; i < d.length; i += 4) { const v = r() * 255; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; } gc.putImageData(grainImg, 0, 0); }

function seek(t) { const c = camera(t); drawBg(t); drawPlanes(t, c); drawFx(t, c); drawHud(t, c); drawText(t); drawOverlays(t, c); drawLogo(t); drawGrain(Math.floor(t * 30)); }
window.seek = seek; window.DUR = DUR;

const render = Q.has("render");
if (render) document.body.classList.add("render");
window.ready = (async () => {
  await document.fonts.load('300 40px "Montserrat"'); await document.fonts.load('400 40px "Montserrat"'); await document.fonts.load('500 40px "Montserrat"'); await document.fonts.load('600 40px "Montserrat"'); await document.fonts.ready;
  await Promise.all([...document.images].map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })));
  await Promise.all([...document.images].map(im => im.decode ? im.decode().catch(() => 0) : 0));
  seek(0); return true;
})();
if (!render) {
  const fit = () => { const s = Math.min(innerWidth / W, (innerHeight - 70) / H); $("stage").style.transform = `scale(${s})`; };
  addEventListener("resize", fit); fit();
  const audio = new Audio("out/gaming-mix.wav"); let playing = false, t0 = 0, start = 0;
  const tick = () => { if (!playing) return; let t = audio.readyState > 2 && !audio.paused ? audio.currentTime : (performance.now() - start) / 1000 + t0; if (t >= DUR) { playing = false; t = DUR; $("play").textContent = "▶ Lecture"; } seek(t); $("scrub").value = t; $("tc").textContent = t.toFixed(2).padStart(5, "0"); requestAnimationFrame(tick); };
  $("play").onclick = () => { playing = !playing; $("play").textContent = playing ? "❚❚ Pause" : "▶ Lecture"; if (playing) { t0 = +$("scrub").value; if (t0 >= DUR - .05) t0 = 0; start = performance.now(); audio.currentTime = t0; audio.play().catch(() => {}); tick(); } else audio.pause(); };
  $("scrub").oninput = e => { const t = +e.target.value; audio.currentTime = t; t0 = t; start = performance.now(); seek(t); $("tc").textContent = t.toFixed(2).padStart(5, "0"); };
}
</script>
