<head>

<title>Empira Agency — Pub 30s (v1 trait)</title>
<style>
@font-face{font-family:"Montserrat";font-style:normal;font-weight:200 700;font-display:block;
  src:url(assets/fonts/montserrat-latin-ext.woff2) format("woff2");
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;}
@font-face{font-family:"Montserrat";font-style:normal;font-weight:200 700;font-display:block;
  src:url(assets/fonts/montserrat-latin.woff2) format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}

:root{
  --gold-1:#F6D58E; --gold-2:#E8B65C; --gold-3:#C98A2E; --gold-4:#9A5A0C;
  --ink:#070605; --text:#F4EFE6; --muted:#B9AE9C;
}
html,body{margin:0;background:#000;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:"Montserrat",sans-serif}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--ink);transform-origin:center center}
#stage > *{position:absolute;left:0;top:0}
canvas{display:block}
#bg{width:1920px;height:1080px}
#contours{width:1920px;height:1080px;overflow:visible}
#world{transform-origin:0 0;width:1px;height:1px}
#world > *{position:absolute}
#wsvg{left:0;top:0;overflow:visible}
#line{width:1920px;height:1080px}
#fx{width:1920px;height:1080px;pointer-events:none}
#vignette{width:1920px;height:1080px;pointer-events:none;
  background:radial-gradient(ellipse 75% 70% at 50% 50%, rgba(0,0,0,0) 45%, rgba(0,0,0,.55) 85%, rgba(0,0,0,.85) 100%)}
#grain{width:1920px;height:1080px;opacity:.075;mix-blend-mode:overlay;pointer-events:none}
#fade{width:1920px;height:1080px;background:#000;pointer-events:none}
#flash{width:1920px;height:1080px;pointer-events:none;opacity:0;mix-blend-mode:screen}

/* typo */
.blk{position:absolute;white-space:nowrap;color:var(--text)}
.blk.c{transform:translateX(-50%);text-align:center}
.w{display:inline-block;will-change:auto}
.gold{background:linear-gradient(135deg,var(--gold-1) 0%,var(--gold-2) 40%,var(--gold-3) 75%,var(--gold-4) 110%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.label{font-weight:500;font-size:22px;letter-spacing:.42em;color:var(--gold-2)}
.h1{font-weight:300;font-size:70px;letter-spacing:.01em;line-height:1.1}
.h1 b{font-weight:500}
.sub{font-weight:300;font-size:30px;letter-spacing:.02em;color:var(--muted)}
.cap{font-weight:500;font-size:21px;letter-spacing:.38em;color:var(--text)}
.node-l{font-weight:500;font-size:20px;letter-spacing:.32em;color:var(--text)}

.logo-part{position:absolute;display:block}
#sweep{position:absolute;-webkit-mask-image:url(assets/logo-icon.png);mask-image:url(assets/logo-icon.png);
  -webkit-mask-size:100% 100%;mask-size:100% 100%;mix-blend-mode:screen;

  background-size:300% 100%;background-repeat:no-repeat}
#cta{font-weight:500;font-size:24px;letter-spacing:.5em;color:var(--gold-2)}

#ui{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;
  font:500 13px/1 "Montserrat",sans-serif;color:#e9dcc2;background:rgba(20,16,10,.8);border:1px solid #5a4422;
  padding:8px 12px;border-radius:999px;z-index:10}
#ui button{font:inherit;color:#140f08;background:linear-gradient(135deg,#F6D58E,#C98A2E);border:0;border-radius:999px;padding:8px 14px;cursor:pointer}
#ui input{width:260px;accent-color:#C98A2E}
body.render #ui{display:none}

<body>
<div id="stage">
  <canvas id="bg" width="1920" height="1080"></canvas>
  <svg id="contours" viewBox="0 0 1920 1080"><g id="contourG"></g></svg>
  <div id="world">
    <div id="glows"></div>
    <svg id="wsvg" width="1" height="1">
      <defs>
        <linearGradient id="gIcon" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="260" y2="260">
          <stop offset="0" stop-color="#F6D58E"/><stop offset=".45" stop-color="#E3AC4E"/>
          <stop offset=".8" stop-color="#B87A22"/><stop offset="1" stop-color="#9A5A0C"/>
        </linearGradient>
        <linearGradient id="gNode" gradientUnits="userSpaceOnUse" x1="-40" y1="-40" x2="40" y2="40">

        </linearGradient>
        <linearGradient id="gCard" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="118" y2="160">
          <stop offset="0" stop-color="#F6D58E"/><stop offset=".6" stop-color="#C98A2E"/><stop offset="1" stop-color="#9A5A0C"/>

<div id="ui"><button id="play">▶ Lecture</button><input id="scrub" type="range" min="0" max="30" step="0.01" value="0"><span id="tc">00.00</span></div>

<script>
"use strict";
/* ============================================================
   EMPIRA AGENCY — 30s, plan-séquence unique.
   Tout est piloté par seek(t) : chaque image est une fonction
   pure du temps → rendu image par image parfaitement stable.
   Tempo musique : 120 BPM (1 temps = 0.5 s, 1 mesure = 2 s).
   ============================================================ */
const W = 1920, H = 1080, DUR = 30;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  sine: t => -(Math.cos(Math.PI * t) - 1) / 2,
  out: t => 1 - Math.pow(1 - t, 3),
  out4: t => 1 - Math.pow(1 - t, 4),
  outExpo: t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t),
  outBack: t => { const c1 = 1.6, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  in: t => t * t * t,
};
function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------------- Logo geometry (pixels du PNG source 4645×3100) ---------------- */
const LS = 0.43;              // échelle PNG → monde
const LX = 8800, LY = -700;   // base du grand A (centre) dans le monde
const lp = (px, py) => [LX + (px - 2322) * LS, LY + (py - 1498) * LS];
const A_BL = lp(1741, 1498), A_TOP = lp(2322, 299), A_BR = lp(2903, 1498);

/* ---------------- Trajet de la ligne dorée ---------------- */
const ROUTE = [
  { p: [-560, 130], r: 0 },
  { p: [3500, 130], r: 220 },
  { p: [5300, -700], r: 220 },
  { p: [A_BL[0], -700], r: 26 },
  { p: A_TOP, r: 0 },
  { p: A_BR, r: 0 },
];
const PX = [], PY = [], PL = [];
(function buildPath() {
  const out = [];
  const push = (x, y) => out.push([x, y]);
  const seg = (a, b) => { const d = Math.hypot(b[0] - a[0], b[1] - a[1]); const n = Math.max(1, Math.ceil(d / 3)); for (let i = 1; i <= n; i++) push(lerp(a[0], b[0], i / n), lerp(a[1], b[1], i / n)); };
  let cur = ROUTE[0].p; push(cur[0], cur[1]);
  for (let i = 1; i < ROUTE.length; i++) {
    const P = ROUTE[i].p, r = ROUTE[i].r;
    if (r > 0 && i < ROUTE.length - 1) {
      const N = ROUTE[i + 1].p;
      const d1 = Math.hypot(P[0] - cur[0], P[1] - cur[1]), d2 = Math.hypot(N[0] - P[0], N[1] - P[1]);
      const a = [P[0] + (cur[0] - P[0]) * r / d1, P[1] + (cur[1] - P[1]) * r / d1];
      const b = [P[0] + (N[0] - P[0]) * r / d2, P[1] + (N[1] - P[1]) * r / d2];
      seg(cur, a);
      for (let k = 1; k <= 60; k++) { const u = k / 60; push((1 - u) * (1 - u) * a[0] + 2 * u * (1 - u) * P[0] + u * u * b[0], (1 - u) * (1 - u) * a[1] + 2 * u * (1 - u) * P[1] + u * u * b[1]); }
      cur = b;
    } else { seg(cur, P); cur = P; }
  }
  let L = 0;
  for (let i = 0; i < out.length; i++) { if (i) L += Math.hypot(out[i][0] - out[i - 1][0], out[i][1] - out[i - 1][1]); PX.push(out[i][0]); PY.push(out[i][1]); PL.push(L); }
})();
function idxAtX(x) { let lo = 0, hi = PX.length - 1; if (x <= PX[0]) return 0; if (x >= PX[hi]) return hi; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (PX[m] < x) lo = m; else hi = m; } return lo + (x - PX[lo]) / Math.max(1e-6, PX[hi] - PX[lo]); }
function ptAtIdx(f) { const i = Math.floor(f), u = f - i; const j = Math.min(i + 1, PX.length - 1); return [lerp(PX[i], PX[j], u), lerp(PY[i], PY[j], u)]; }
const yOnLine = x => ptAtIdx(idxAtX(x))[1];

/* Spark : temps → position x (interpolation cubique monotone) */
const NODE_X = [0.1, 0.3, 0.5, 0.7, 0.9].map(f => lerp(3500, 5300, f));
const CARD0 = 5950, CARD_STEP = 134, CARD_W = 118;
const SPARK_KEYS = [
  [0.4, -560], [2.2, 560], [3.4, 900], [4.8, 1650], [5.5, 1900], [7.0, 2450], [8.5, 3000], [9.6, 3420],
  [11, NODE_X[0]], [12, NODE_X[1]], [13, NODE_X[2]], [14, NODE_X[3]], [15, NODE_X[4]], [16.2, 5560],
  ...Array.from({ length: 12 }, (_, i) => [17.25 + 0.25 * i, CARD0 + CARD_W / 2 + CARD_STEP * i]),
  [20.9, A_BL[0]], [21.5, A_TOP[0]], [22.0, A_BR[0]],
];
const sparkX = (function () {
  const xs = SPARK_KEYS.map(k => k[0]), ys = SPARK_KEYS.map(k => k[1]), n = xs.length;
  const d = [], m = new Array(n);
  for (let i = 0; i < n - 1; i++) d.push((ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]));
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
  for (let i = 0; i < n - 1; i++) { if (d[i] === 0) { m[i] = m[i + 1] = 0; continue; } const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b; if (s > 9) { const t = 3 / Math.sqrt(s); m[i] = t * a * d[i]; m[i + 1] = t * b * d[i]; } }
  return t => {
    if (t <= xs[0]) return ys[0]; if (t >= xs[n - 1]) return ys[n - 1];
    let i = 0; while (t > xs[i + 1]) i++;
    const h = xs[i + 1] - xs[i], u = (t - xs[i]) / h, u2 = u * u, u3 = u2 * u;
    return (2 * u3 - 3 * u2 + 1) * ys[i] + (u3 - 2 * u2 + u) * h * m[i] + (-2 * u3 + 3 * u2) * ys[i + 1] + (u3 - u2) * h * m[i + 1];
  };
})();
const sparkPt = t => ptAtIdx(idxAtX(sparkX(t)));

/* ---------------- Caméra (plans + mouvements, lissés) ---------------- */
// [t, cx, cy, zoom, rot(deg), easing-du-mouvement-qui-arrive]
const CAM = [
  [0.0, -20, 10, 1.24, 0], [3.4, 170, 15, 1.17, 0],
  [4.8, 2330, -60, 1.0, 0, "inOut"], [9.3, 2560, -60, 1.025, 0],
  [10.5, 4350, -270, 0.95, -1.2, "inOut"], [15.4, 4500, -370, 0.975, -0.6],
  [16.8, 6680, -880, 1.0, 0, "inOut"], [19.9, 6830, -880, 1.025, 0],
  [20.9, 8800, -955, 1.1, 0, "inOut"], [22.0, 8800, -975, 1.16, 0],
  [23.7, 8800, -615, 0.79, 0, "out4"], [30.0, 8800, -615, 0.815, 0],
];
const camRaw = t => {
  let i = 0; while (i < CAM.length - 2 && t > CAM[i + 1][0]) i++;
  const a = CAM[i], b = CAM[i + 1]; let u = prog(t, a[0], b[0]);
  u = b[5] ? E[b[5]](u) : u; // plans = dérive linéaire lente ; mouvements = easing
  return [lerp(a[1], b[1], u), lerp(a[2], b[2], u), lerp(a[3], b[3], u), lerp(a[4], b[4], u)];
};
const CAM_HZ = 120, CAM_N = DUR * CAM_HZ + 1, camTab = [];
(function smoothCam() {
  const raw = []; for (let i = 0; i < CAM_N; i++) raw.push(camRaw(i / CAM_HZ));
  const sig = 0.16 * CAM_HZ, R = Math.ceil(sig * 3), k = []; let ks = 0;
  for (let j = -R; j <= R; j++) { const v = Math.exp(-j * j / (2 * sig * sig)); k.push(v); ks += v; }
  for (let i = 0; i < CAM_N; i++) {
    // pas de lissage juste après l'impact (garde le "coup")
    const t = i / CAM_HZ, local = (t > 21.98 && t < 22.25) ? 0.25 : 1;
    const acc = [0, 0, 0, 0];
    for (let j = -R; j <= R; j++) { const s = raw[clamp(i + Math.round(j * local), 0, CAM_N - 1)]; const w = k[j + R] / ks; for (let c = 0; c < 4; c++) acc[c] += s[c] * w; }
    camTab.push(acc);
  }
})();
function camera(t) {
  const f = clamp(t, 0, DUR) * CAM_HZ, i = Math.floor(f), u = f - i, a = camTab[i], b = camTab[Math.min(i + 1, CAM_N - 1)];
  let [x, y, z, r] = a.map((v, c) => lerp(v, b[c], u));
  // respiration (caméra jamais figée)
  x += Math.sin(t * 0.83) * 6 + Math.sin(t * 0.37 + 1) * 5;
  y += Math.sin(t * 0.61 + 2) * 5;
  r += Math.sin(t * 0.29) * 0.18;
  // micro-secousse à l'impact
  const s = prog(t, 22.0, 22.45); if (s > 0 && s < 1) { const amp = (1 - s) * (1 - s) * 7; x += Math.sin(t * 190) * amp; y += Math.cos(t * 230) * amp; }
  return { x, y, z, r: r * Math.PI / 180 };
}
const toScreen = (c, wx, wy) => { const dx = (wx - c.x) * c.z, dy = (wy - c.y) * c.z, cs = Math.cos(c.r), sn = Math.sin(c.r); return [W / 2 + dx * cs - dy * sn, H / 2 + dx * sn + dy * cs]; };

/* ---------------- Construction de la scène ---------------- */
const $ = id => document.getElementById(id);
const SVGNS = "http://www.w3.org/2000/svg";
const sv = (tag, attrs, parent) => { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };

// Halos chauds dans le monde
[[0, 20, 900, .16], [2450, -40, 1000, .13], [4450, -320, 1000, .12], [6750, -860, 1000, .12], [8800, -800, 1200, .2]].forEach(([x, y, r, a]) => {
  const d = document.createElement("div");
  Object.assign(d.style, { left: (x - r) + "px", top: (y - r) + "px", width: 2 * r + "px", height: 2 * r + "px", borderRadius: "50%",
    background: `radial-gradient(circle, rgba(214,150,58,${a}) 0%, rgba(150,90,20,${a * .35}) 40%, rgba(0,0,0,0) 70%)` });
  $("glows").appendChild(d);
});

// Textes (mots animés individuellement)
const TEXTS = [];
function text(cls, html, x, y, t0, opt = {}) {
  const d = document.createElement("div");
  d.className = "blk " + cls + (opt.center ? " c" : "");
  d.style.left = x + "px"; d.style.top = y + "px";
  // découpe en mots en conservant les balises <g>…</g> (or) et <b>
  const words = [];
  html.replace(/<g>(.*?)<\/g>|([^<]+)/g, (m, g, plain) => { (g || plain).trim().split(/\s+/).forEach(w => w && words.push({ w, gold: !!g })); });
  words.forEach((o, i) => { const s = document.createElement("span"); s.className = "w" + (o.gold ? " gold" : ""); s.textContent = o.w; d.appendChild(s); if (i < words.length - 1) d.appendChild(document.createTextNode(" ")); });
  $("texts").appendChild(d);
  TEXTS.push({ el: d, spans: [...d.querySelectorAll(".w")], t0, stag: opt.stag ?? 0.07, dur: opt.dur ?? 0.8, dim: opt.dim });
}
// — Accroche
text("h1", "Tu crées du contenu ?", 0, -150, 0.7, { center: true, dim: [3.6, 4.6] });
text("h1", "<g>Passe au niveau supérieur.</g>", 0, -40, 1.75, { center: true, stag: 0.09 });
// — 01 Équipement
text("label", "01 — ÉQUIPEMENT", 2450, -470, 4.5, { center: true, stag: 0.05 });
text("h1", "Équipe-toi <g>comme un pro.</g>", 2450, -415, 4.75, { center: true });
text("sub", "On t'accompagne dans l'achat de ton matériel.", 2450, 262, 6.4, { center: true, stag: 0.045 });
// — 02 Accompagnement
text("label", "02 — ACCOMPAGNEMENT", 3720, -800, 10.1, { stag: 0.05 });
text("h1", "De tes débuts", 3716, -748, 10.35);
text("h1", "<g>à tes objectifs.</g>", 3716, -666, 10.7);
text("sub", "Un suivi sur-mesure, étape par étape.", 3720, -560, 11.4, { stag: 0.05 });
// — 03 Événements
text("label", "03 — ÉVÉNEMENTS", 6746, -1250, 16.45, { center: true, stag: 0.05 });
text("h1", "Un événement <g>chaque mois.</g>", 6746, -1195, 16.7, { center: true });
text("sub", "Rencontre d'autres créateurs et développe ton réseau.", 6746, -640, 18.4, { center: true, stag: 0.045 });

/* — Icônes matériel (dessin au trait) — */
const ICONS = [];
const ICON_DEF = [
  { x: 1900, t: 5.5, label: "CAMÉRA", draw: g => {
      sv("rect", { x: 28, y: 92, width: 204, height: 132, rx: 22 }, g);
      sv("path", { d: "M84 92 L100 64 H160 L176 92" }, g);
      sv("rect", { x: 44, y: 76, width: 26, height: 10, rx: 3 }, g);
      sv("circle", { cx: 130, cy: 158, r: 50 }, g);
      sv("circle", { cx: 130, cy: 158, r: 32 }, g);
      sv("rect", { x: 190, y: 108, width: 22, height: 12, rx: 3 }, g);
    }, extra: g => { // reflet d'objectif + éclair
      const lens = sv("circle", { cx: 130, cy: 158, r: 14, fill: "url(#gLight)", stroke: "none", opacity: 0 }, g);
      const ring = sv("path", { d: "M130 116 A42 42 0 0 1 172 158", stroke: "#FFF1CF", "stroke-width": 3, fill: "none", opacity: 0, "stroke-linecap": "round" }, g);
      return { lens, ring };
    } },
  { x: 2450, t: 7.0, label: "MICRO", draw: g => {
      sv("rect", { x: 96, y: 26, width: 68, height: 124, rx: 34 }, g);
      sv("path", { d: "M104 64 H156 M102 86 H158 M104 108 H156" }, g);
      sv("path", { d: "M68 112 V122 A62 62 0 0 0 192 122 V112" }, g);
      sv("path", { d: "M130 184 V230 M94 232 H166" }, g);
    }, extra: g => {
      const waves = [0, 1, 2].map(i => {
        const r = 30 + i * 22;
        return [sv("path", { d: `M${60 - i * 18} ${88 - r * .55} A${r} ${r} 0 0 0 ${60 - i * 18} ${88 + r * .55}`, fill: "none", stroke: "url(#gIcon)", "stroke-width": 4, "stroke-linecap": "round", opacity: 0 }, g),
                sv("path", { d: `M${200 + i * 18} ${88 - r * .55} A${r} ${r} 0 0 1 ${200 + i * 18} ${88 + r * .55}`, fill: "none", stroke: "url(#gIcon)", "stroke-width": 4, "stroke-linecap": "round", opacity: 0 }, g)];
      });

    } },
  { x: 3000, t: 8.5, label: "LUMIÈRE", draw: g => {

      sv("circle", { cx: 130, cy: 98, r: 58 }, g);

ICON_DEF.forEach(def => {

});

/* — Étapes de l'accompagnement — */

/* — Logo (découpes du PNG officiel) — */

[["icon", 1729, 287, 1187, 1224], ["empira", 949, 1786, 2747, 413], ["agency", 288, 2381, 4069, 160], ["tagline", 288, 2688, 4069, 127]].forEach(([n, px, py, w, h]) => {

});
const cta = document.createElement("div"); cta.id = "cta"; cta.className = "blk c"; cta.textContent = "REJOINS L'AVENTURE";

/* — Courbes de niveau en arrière-plan (parallaxe 0.55) — */
const CONT_DEPTH = 0.55;
(function contours() {
  const G = $("contourG"), r = rng(7);
  const centers = [[-200, 300], [1700, -500], [3300, 500], [4300, -900], [5800, -100], [7400, -1300], [8600, -500]];
  centers.forEach(([cx, cy], ci) => {
    const ph = [r() * 6.28, r() * 6.28, r() * 6.28];
    for (let k = 1; k <= 9; k++) {
      const R = 70 * k + r() * 20; let d = "";
      for (let s = 0; s <= 120; s++) { const a = s / 120 * Math.PI * 2; const rr = R * (1 + .10 * Math.sin(3 * a + ph[0] + k * .15) + .06 * Math.sin(5 * a + ph[1]) + .04 * Math.sin(2 * a + ph[2] - k * .1)); d += (s ? "L" : "M") + (cx * CONT_DEPTH + Math.cos(a) * rr).toFixed(1) + " " + (cy * CONT_DEPTH + Math.sin(a) * rr * .72).toFixed(1); }
      sv("path", { d: d + "Z", fill: "none", stroke: "rgba(214,160,72," + (0.11 - k * 0.008).toFixed(3) + ")", "stroke-width": 1.4 }, G);
    }
  });
})();

/* ---------------- Particules / poussière d'or ---------------- */
const LAYERS = [
  { depth: 0.25, n: 90, size: [0.6, 1.6], a: .35, blur: 0 },
  { depth: 0.6, n: 70, size: [1, 2.4], a: .5, blur: 0 },
  { depth: 1.35, n: 14, size: [6, 16], a: .10, blur: 1 }, // bokeh avant-plan
].map((L, li) => { const r = rng(100 + li); L.p = Array.from({ length: L.n }, () => ({ x: r() * 2400, y: r() * 1500, s: lerp(L.size[0], L.size[1], r()), ph: r() * 6.28, sp: .3 + r() * .7, vx: (r() - .5) * 8, vy: -4 - r() * 10 })); return L; });

const bg = $("bg").getContext("2d"), lc = $("line").getContext("2d"), gc = $("grain").getContext("2d");
const grainImg = gc.createImageData(640, 360);

function drawBackground(t, c) {
  bg.setTransform(1, 0, 0, 1, 0, 0);
  const g = bg.createRadialGradient(W / 2, H * .55, 50, W / 2, H * .55, 1200);
  g.addColorStop(0, "#15100a"); g.addColorStop(.55, "#0a0806"); g.addColorStop(1, "#040303");
  bg.fillStyle = g; bg.fillRect(0, 0, W, H);
  for (const L of LAYERS) {
    const tw = 2400, th = 1500;
    for (const p of L.p) {
      let x = p.x + p.vx * t - c.x * L.depth * c.z, y = p.y + p.vy * t - c.y * L.depth * c.z;
      x = ((x % tw) + tw) % tw - 240; y = ((y % th) + th) % th - 210;
      const tw8 = .55 + .45 * Math.sin(t * p.sp * 2 + p.ph);
      const a = L.a * tw8;
      if (L.blur) {
        const rg = bg.createRadialGradient(x, y, 0, x, y, p.s * 3);
        rg.addColorStop(0, `rgba(240,192,102,${a})`); rg.addColorStop(1, "rgba(240,192,102,0)");
        bg.fillStyle = rg; bg.beginPath(); bg.arc(x, y, p.s * 3, 0, 6.283); bg.fill();
      } else {
        bg.fillStyle = `rgba(243,205,130,${a})`; bg.beginPath(); bg.arc(x, y, p.s, 0, 6.283); bg.fill();
      }
    }
  }
}

function lineGradient(ctx) {
  const g = ctx.createLinearGradient(-700, 0, 9200, 0);
  const cols = ["#9A5A0C", "#D99A3A", "#F6D58E", "#E3AC4E", "#B87A22"];
  for (let i = 0; i <= 40; i++) g.addColorStop(i / 40, cols[i % cols.length]);
  return g;
}
let LG = null;

function drawLine(t, c) {
  lc.setTransform(1, 0, 0, 1, 0, 0); lc.clearRect(0, 0, W, H);
  const born = prog(t, 0.25, 0.6);
  if (born <= 0) return;
  const cs = Math.cos(c.r) * c.z, sn = Math.sin(c.r) * c.z;
  lc.setTransform(cs, sn, -sn, cs, W / 2 - (c.x * cs - c.y * sn), H / 2 - (c.x * sn + c.y * cs));
  if (!LG) LG = lineGradient(lc);
  const f = idxAtX(sparkX(t)), n = Math.floor(f), head = ptAtIdx(f);
  const fadeOut = 1 - E.out(prog(t, 22.0, 22.6));
  if (fadeOut > 0 && n > 0) {
    lc.lineJoin = "round"; lc.lineCap = "round";
    const path = new Path2D(); path.moveTo(PX[0], PY[0]);
    for (let i = 1; i <= n; i += 2) path.lineTo(PX[i], PY[i]);
    path.lineTo(head[0], head[1]);
    lc.globalAlpha = .45 * fadeOut * born; lc.strokeStyle = "#E8B65C"; lc.lineWidth = 9 / Math.max(c.z, .5);
    lc.shadowColor = "rgba(240,180,80,.9)"; lc.shadowBlur = 22; lc.stroke(path);
    lc.shadowBlur = 0; lc.globalAlpha = fadeOut * born; lc.strokeStyle = LG; lc.lineWidth = 3.2; lc.stroke(path);
  }
  // étincelles de traîne (émises le long du trajet, déterministes)
  const EMIT = 0.025, LIFE = 1.1;
  if (t < 22.15) {
    for (let j = Math.max(0, Math.floor((t - LIFE) / EMIT)); j * EMIT <= t; j++) {
      const e = j * EMIT; if (e < 0.45) continue;
      const age = t - e, p = sparkPt(e), hx = hash(j), hy = hash(j + 999), hs = hash(j + 555);
      const x = p[0] + (hx - .5) * 60 * age, y = p[1] + (hy - .5) * 60 * age - 26 * age + 30 * age * age;
      const a = (1 - age / LIFE) * .8 * born;
      lc.globalAlpha = a; lc.fillStyle = hs > .7 ? "#FFF3D6" : "#F0C066";
      lc.beginPath(); lc.arc(x, y, (0.8 + hs * 2.2) * (1 - age / LIFE * .6) / Math.max(c.z, .6), 0, 6.283); lc.fill();
    }
    // tête lumineuse
    const pulse = 1 + .12 * Math.sin(t * 9);
    const R = 34 * pulse * born;
    const rg = lc.createRadialGradient(head[0], head[1], 0, head[0], head[1], R);
    rg.addColorStop(0, "rgba(255,250,235,1)"); rg.addColorStop(.18, "rgba(255,230,170,.95)"); rg.addColorStop(.45, "rgba(240,180,80,.35)"); rg.addColorStop(1, "rgba(240,180,80,0)");
    lc.globalAlpha = 1; lc.fillStyle = rg; lc.beginPath(); lc.arc(head[0], head[1], R, 0, 6.283); lc.fill();
  }
  lc.globalAlpha = 1;
}

function drawGrain(frame) {
  const r = rng(frame * 7919 + 13), d = grainImg.data;
  for (let i = 0; i < d.length; i += 4) { const v = r() * 255; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
  gc.putImageData(grainImg, 0, 0);
}

/* ---------------- seek(t) : état complet à l'instant t ---------------- */
function seek(t) {
  const c = camera(t);
  const cs = Math.cos(c.r), sn = Math.sin(c.r);
  $("world").style.transform = `translate(${W / 2}px,${H / 2}px) rotate(${c.r}rad) scale(${c.z}) translate(${-c.x}px,${-c.y}px)`;
  const cz = 1 + (c.z - 1) * CONT_DEPTH;
  $("contourG").setAttribute("transform", `translate(${W / 2},${H / 2}) rotate(${c.r * 180 / Math.PI}) scale(${cz}) translate(${-c.x * CONT_DEPTH},${-c.y * CONT_DEPTH})`);
  drawBackground(t, c);
  drawLine(t, c);

  // Textes
  for (const T of TEXTS) {
    let dim = 1; if (T.dim) dim = 1 - .75 * E.sine(prog(t, T.dim[0], T.dim[1]));
    T.spans.forEach((s, i) => {
      const u = prog(t, T.t0 + i * T.stag, T.t0 + i * T.stag + T.dur), e = E.out(u);
      s.style.opacity = (e * dim).toFixed(3);
      s.style.transform = `translateY(${((1 - e) * 34).toFixed(2)}px)`;
      const b = (1 - E.out4(u)) * 12; s.style.filter = b > .05 ? `blur(${b.toFixed(2)}px)` : "none";
    });
  }

  // Icônes
  ICONS.forEach(({ def, g, els, ex }, k) => {
    els.forEach((e, i) => { const u = E.inOut(prog(t, def.t - .55 + i * .07, def.t + .45 + i * .07)); e.setAttribute("stroke-dashoffset", (1 - u).toFixed(4)); });
    const done = prog(t, def.t + .5, def.t + .9);
    g.style.filter = done > 0 ? `drop-shadow(0 0 ${(4 + 10 * done).toFixed(1)}px rgba(240,180,80,${(.55 * done).toFixed(2)}))` : "none";
    if (k === 0) { // déclencheur photo
      const f = prog(t, def.t + .55, def.t + 1.1);
      ex.lens.setAttribute("opacity", (f > 0 ? (f < .15 ? f / .15 : 1 - (f - .15) / .85 * .55) : 0).toFixed(3));
      ex.lens.setAttribute("r", (14 + 60 * E.out(clamp(f * 3)) * (1 - f) + 6).toFixed(1));
      ex.ring.setAttribute("opacity", (done * .8).toFixed(2));
      ex.ring.setAttribute("transform", `rotate(${((t - def.t) * 40).toFixed(1)} 130 158)`);
    } else if (k === 1) { // ondes sonores
      ex.waves.forEach((pair, i) => { const cyc = ((t - def.t - .6 - i * .18) % 1.2 + 1.2) % 1.2 / 1.2; const on = t > def.t + .6 + i * .18; const a = on ? Math.sin(cyc * Math.PI) * .9 : 0; pair.forEach(p => p.setAttribute("opacity", a.toFixed(3))); });
    } else { // allumage ring light
      const on = E.out(prog(t, def.t + .55, def.t + 1.0)), flick = t < def.t + 1.0 && t > def.t + .55 ? (Math.sin(t * 90) > 0 ? 1 : .5) : 1;
      ex.glow.setAttribute("opacity", (on * .55 * flick).toFixed(3));
      ex.ring.setAttribute("opacity", (on * .5 * flick).toFixed(3));
    }
  });

  // Étapes
  NODES.forEach(N => {
    const a = E.out(prog(t, N.t - .35, N.t + .1));
    N.ring.setAttribute("stroke-dashoffset", (1 - a).toFixed(4));
    const p = prog(t, N.t, N.t + .45);
    const s = p > 0 ? E.outBack(p) : 0;
    N.core.setAttribute("transform", `scale(${s.toFixed(3)})`);
    const q = prog(t, N.t, N.t + 1.1);
    N.ping.setAttribute("r", (20 + 70 * E.out(q)).toFixed(1));
    N.ping.setAttribute("opacity", (q > 0 && q < 1 ? (1 - q) * .8 : 0).toFixed(3));
  });

  // Calendrier
  CARDS.forEach(C => {
    const ap = E.out(prog(t, C.appear, C.appear + .6));
    const l = prog(t, C.t - .04, C.t + .3), le = E.out(l);
    C.g.setAttribute("opacity", ap.toFixed(3));
    C.g.setAttribute("transform", `translate(${C.x},${(-902 + (1 - ap) * 24 - 8 * le).toFixed(2)})`);
    C.lit.setAttribute("opacity", le.toFixed(3));
    C.star.setAttribute("opacity", le.toFixed(3));
    C.star.setAttribute("transform", `translate(${CARD_W / 2} 100) scale(${(l > 0 ? E.outBack(l) : 0).toFixed(3)}) rotate(${((le - 1) * 90).toFixed(1)}) translate(${-CARD_W / 2} -100)`);
    C.dot.setAttribute("opacity", (1 - le).toFixed(3));
    C.tx.setAttribute("fill", le > .5 ? "#F4EFE6" : "#8f8473");
  });

  // Logo
  const imp = 22.0;
  const fill = prog(t, imp - .06, imp + .12);
  LOGO.icon.style.opacity = E.out(fill).toFixed(3);
  LOGO.icon.style.transform = `scale(${(1 + .05 * (1 - E.out(prog(t, imp, imp + .7)))).toFixed(4)})`;
  LOGO.icon.style.transformOrigin = "50% 100%";
  const sw = prog(t, imp + .5, imp + 1.4);
  LOGO.sweep.style.opacity = sw > 0 && sw < 1 ? 1 : 0;
  LOGO.sweep.style.backgroundPosition = `${(100 - sw * 100).toFixed(2)}% 0`;
  const rev = (el, a, b, mode) => {
    const u = E.inOut(prog(t, a, b));
    el.style.opacity = u > 0 ? 1 : 0;
    if (mode === "lr") { const X = -15 + u * 130; el.style.webkitMaskImage = el.style.maskImage = `linear-gradient(90deg,#000 ${X - 15}%,transparent ${X}%)`; }
    else { const X = u * 62; el.style.webkitMaskImage = el.style.maskImage = `linear-gradient(90deg,transparent ${50 - X - 12}%,#000 ${50 - X}%,#000 ${50 + X}%,transparent ${50 + X + 12}%)`; }
    el.style.transform = `translateY(${((1 - E.out(prog(t, a, b))) * 14).toFixed(2)}px)`;
  };
  rev(LOGO.empira, imp + .45, imp + 1.6, "lr");
  rev(LOGO.agency, imp + 1.25, imp + 2.3, "c");
  rev(LOGO.tagline, imp + 2.0, imp + 3.3, "c");
  const ct = E.out(prog(t, 27.0, 27.9)); cta.style.opacity = ct.toFixed(3); cta.style.letterSpacing = (0.62 - .12 * ct).toFixed(3) + "em";
  SHOCK.forEach((s, i) => { const q = prog(t, imp + i * .08, imp + 1.3 + i * .2); s.setAttribute("r", (40 + 1100 * E.outExpo(q)).toFixed(1)); s.setAttribute("opacity", (q > 0 && q < 1 ? (1 - q) * (i ? .35 : .6) : 0).toFixed(3)); });

  // Flash d'impact (espace écran)
  const [fx, fy] = toScreen(c, LX, LY - 260);
  const fl = prog(t, imp - .03, imp + .55), fa = fl > 0 && fl < 1 ? Math.pow(1 - fl, 2.2) : 0;
  const fe = $("flash"); fe.style.opacity = fa.toFixed(3);
  fe.style.background = `radial-gradient(circle at ${fx.toFixed(0)}px ${fy.toFixed(0)}px, rgba(255,246,222,.95) 0%, rgba(240,190,100,.55) 18%, rgba(160,100,30,.12) 45%, rgba(0,0,0,0) 70%)`;

  // Fondu entrée/sortie
  $("fade").style.opacity = (Math.max(1 - E.out(prog(t, 0, .9)), E.in(prog(t, 29.35, 30)))).toFixed(3);
  drawGrain(Math.floor(t * 30));
}
window.seek = seek;
window.DUR = DUR;

/* ---------------- Lecture temps réel (aperçu) ---------------- */
const render = new URLSearchParams(location.search).has("render");
if (render) document.body.classList.add("render");
window.ready = (async () => {
  await document.fonts.load('300 40px "Montserrat"'); await document.fonts.load('500 40px "Montserrat"'); await document.fonts.ready;
  await Promise.all([...document.images].map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })));
  seek(0); return true;
})();
if (!render) {
  const fit = () => { const s = Math.min(innerWidth / W, innerHeight / H); $("stage").style.transform = `scale(${s})`; };
  addEventListener("resize", fit); fit();
  const audio = new Audio("out/empira-mix.wav"); let playing = false, t0 = 0, start = 0;
  const tick = () => { if (!playing) return; let t = audio.readyState > 2 && !audio.paused ? audio.currentTime : (performance.now() - start) / 1000 + t0; if (t >= DUR) { playing = false; t = DUR; $("play").textContent = "▶ Lecture"; } seek(t); $("scrub").value = t; $("tc").textContent = t.toFixed(2).padStart(5, "0"); requestAnimationFrame(tick); };
  $("play").onclick = () => { playing = !playing; $("play").textContent = playing ? "❚❚ Pause" : "▶ Lecture"; if (playing) { t0 = +$("scrub").value; if (t0 >= DUR - .05) t0 = 0; start = performance.now(); audio.currentTime = t0; audio.play().catch(() => {}); tick(); } else audio.pause(); };
  $("scrub").oninput = e => { const t = +e.target.value; audio.currentTime = t; t0 = t; start = performance.now(); seek(t); $("tc").textContent = t.toFixed(2).padStart(5, "0"); };
}
