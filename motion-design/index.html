<script>
"use strict";
/* =====================================================================
   EMPIRA AGENCY — « L'Ascension » — 30 s, un seul plan-séquence.
   Caméra 3D (projection perspective) qui traverse de vraies photos
   étalonnées noir & or. Tout est fonction de t → rendu image par image.
   Tempo 120 BPM : temps = 0.5 s, mesure = 2 s. Impact logo à 22.0 s.
   ===================================================================== */
const W = 1920, H = 1080, DUR = 30, F = 1000;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const bell = (t, a, m, b) => t <= a || t >= b ? 0 : t < m ? E.sine((t - a) / (m - a)) : 1 - E.sine((t - m) / (b - m));
const E = {
  lin: t => t,
  sine: t => -(Math.cos(Math.PI * t) - 1) / 2,
  inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  in: t => t * t * t, in2: t => t * t,
  out: t => 1 - Math.pow(1 - t, 3), out4: t => 1 - Math.pow(1 - t, 4),
  outExpo: t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t),
  outBack: t => { const c1 = 1.6, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
};
function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const $ = id => document.getElementById(id);

/* ---------------------------- Photos (plans 3D) ---------------------------- */
// anchor = point (u,v) de l'image placé en `at` (monde) ; w = largeur monde
const P = {};
function plane(id, src, iw, ih, w, anchor, at, o = {}) {
  const h = w * ih / iw;
  const cx = at[0] + (0.5 - anchor[0]) * w, cy = at[1] + (0.5 - anchor[1]) * h;
  const el = document.createElement("div"); el.className = "plane";
  el.style.width = w + "px"; el.style.height = h + "px";
  if (o.blend) el.style.mixBlendMode = o.blend;
  if (o.mask) { el.style.webkitMaskImage = el.style.maskImage = o.mask; }
  const im = document.createElement("img"); im.src = src; el.appendChild(im);
  if (o.sheen) { const s = document.createElement("div"); s.className = "sheen"; el.appendChild(s); o.sheenEl = s; }
  $("cam").appendChild(el);
  P[id] = Object.assign({ id, el, w, h, x: cx - w / 2, y: cy - h / 2, z: at[2], at, anchor }, o);
  return P[id];
}
// uv → monde
const uvw = (p, u, v) => [p.x + u * p.w, p.y + v * p.h, p.z];
const FEATHER_X = "linear-gradient(90deg,transparent 0%,#000 27%,#000 73%,transparent 100%)";
const FEATHER = "radial-gradient(ellipse 58% 58% at 50% 50%,#000 55%,transparent 100%)";

// Ordre = profondeur (le plus lointain d'abord pour l'empilement)
plane("peak", "assets/photos/peak.jpg", 3200, 2134, 4600, [0.489, 0.365], [11250, -700, 15200], { mask: "radial-gradient(ellipse 60% 62% at 50% 46%,#000 50%,transparent 100%)" });
plane("bokeh", "assets/photos/bokeh.jpg", 1600, 2400, 2600, [0.5, 0.45], [11250, -560, 12900], { blend: "screen" });
plane("crowd", "assets/photos/crowd.jpg", 3200, 2134, 2900, [0.45, 0.22], [11250, -600, 12100], { mask: FEATHER_X });
plane("summit", "assets/photos/summit.jpg", 3200, 2134, 2900, [0.505, 0.49], [8900, -120, 12000], { mask: FEATHER_X });
plane("walk", "assets/photos/walk.jpg", 3200, 2134, 2900, [0.31, 0.735], [3880, 330, 12000], { mask: FEATHER_X });
plane("climb", "assets/photos/climb.jpg", 2944, 1928, 2800, [0.43, 0.60], [6380, 40, 11900], { mask: FEATHER_X });
plane("ring", "assets/photos/ring.jpg", 2560, 3200, 2300, [0.49, 0.53], [3300, 0, 8800], { blend: "screen", mask: FEATHER });
plane("mic", "assets/photos/mic.jpg", 3000, 3000, 2200, [0.53, 0.42], [1500, -60, 7200], { blend: "screen", sheen: true, mask: "radial-gradient(ellipse 62% 70% at 52% 40%,#000 55%,transparent 100%)" });
plane("camera", "assets/photos/camera.jpg", 2133, 3200, 1750, [0.42, 0.48], [-260, 0, 5800], { mask: "radial-gradient(ellipse 52% 50% at 50% 46%,#000 50%,transparent 100%)", sheen: true });
plane("lens", "assets/photos/lens.jpg", 3247, 4058, 3200, [0.56, 0.40], [0, 0, 4000], { blend: "screen" });

/* ---------------------------- Caméra ---------------------------- */
// [t, x, y, z, roll°, easing du mouvement qui arrive]
const CAM = [
  [0.0, 0, 30, 0, 0], [2.9, 0, 10, 1350, 0],
  [4.2, 0, 0, 3990, 0, "in2"],
  [4.95, -150, 0, 4520, -1.2, "out"], [5.95, -80, 0, 4820, -0.6],
  [6.7, 1060, -30, 5650, 0.8, "inOut"], [7.45, 1150, -40, 5820, 0.4],
  [8.05, 3240, 0, 7250, -0.6, "inOut"], [9.3, 3300, 0, 7880, 0],
  [10.15, 3640, 210, 10420, 0, "in2"],
  [10.7, 3800, 210, 10500, -0.8, "out"], [15.35, 8700, 40, 10500, 0.6],
  [16.45, 10250, -40, 10460, 0, "inOut"], [19.15, 11560, -90, 10620, -0.4],
  [20.25, 11250, -600, 11880, 0, "in2"],
  [20.9, 11250, -650, 12900, 0, "out"], [21.95, 11250, -640, 13450, 0],
  [24.2, 11250, -1600, 13560, 0, "out4"], [30.0, 11250, -1680, 13760, 0],
];
const camRaw = t => {
  let i = 0; while (i < CAM.length - 2 && t > CAM[i + 1][0]) i++;
  const a = CAM[i], b = CAM[i + 1]; let u = prog(t, a[0], b[0]); u = b[5] ? E[b[5]](u) : u;
  return [lerp(a[1], b[1], u), lerp(a[2], b[2], u), lerp(a[3], b[3], u), lerp(a[4], b[4], u)];
};
const CAM_HZ = 120, CAM_N = DUR * CAM_HZ + 1, camTab = [];
(function () {
  const raw = []; for (let i = 0; i < CAM_N; i++) raw.push(camRaw(i / CAM_HZ));
  const sig = 0.14 * CAM_HZ, R = Math.ceil(sig * 3), k = []; let ks = 0;
  for (let j = -R; j <= R; j++) { const v = Math.exp(-j * j / (2 * sig * sig)); k.push(v); ks += v; }
  for (let i = 0; i < CAM_N; i++) { const acc = [0, 0, 0, 0]; for (let j = -R; j <= R; j++) { const s = raw[clamp(i + j, 0, CAM_N - 1)], w = k[j + R] / ks; for (let c = 0; c < 4; c++) acc[c] += s[c] * w; } camTab.push(acc); }
})();
function camera(t) {
  const f = clamp(t, 0, DUR) * CAM_HZ, i = Math.floor(f), u = f - i, a = camTab[i], b = camTab[Math.min(i + 1, CAM_N - 1)];
  let [x, y, z, r] = a.map((v, c) => lerp(v, b[c], u));
  // caméra « épaule » très légère (jamais figée)
  x += Math.sin(t * 0.9) * 5 + Math.sin(t * 2.3 + 1) * 1.5; y += Math.sin(t * 0.7 + 2) * 4 + Math.cos(t * 2.9) * 1.2; r += Math.sin(t * 0.37) * 0.15;
  const s = prog(t, 22.0, 22.5); if (s > 0 && s < 1) { const amp = (1 - s) * (1 - s) * 9; x += Math.sin(t * 190) * amp; y += Math.cos(t * 230) * amp; }
  return { x, y, z, r: r * Math.PI / 180 };
}
// projection (avant roulis) ; le roulis est appliqué au conteneur / au canvas
function proj(c, X, Y, Z) { const d = Z - c.z; if (d <= 1) return null; const s = F / d; return [W / 2 + (X - c.x) * s, H / 2 + (Y - c.y) * s, s, d]; }
function rollPt(c, p) { const cs = Math.cos(c.r), sn = Math.sin(c.r), dx = p[0] - W / 2, dy = p[1] - H / 2; return [W / 2 + dx * cs - dy * sn, H / 2 + dx * sn + dy * cs]; }

/* ---------------------------- Ligne dorée (3D) ---------------------------- */
// chemin : points monde + instant de passage de l'étincelle
function mkPath(keys) {
  // Catmull-Rom densifiée, paramétrée par le temps
  const pts = [], times = [];
  for (let i = 0; i < keys.length - 1; i++) {
    const p0 = keys[Math.max(0, i - 1)].p, p1 = keys[i].p, p2 = keys[i + 1].p, p3 = keys[Math.min(keys.length - 1, i + 2)].p;
    const n = 40;
    for (let k = 0; k < n; k++) {
      const u = k / n, u2 = u * u, u3 = u2 * u;
      const q = [0, 1, 2].map(c => 0.5 * ((2 * p1[c]) + (-p0[c] + p2[c]) * u + (2 * p0[c] - 5 * p1[c] + 4 * p2[c] - p3[c]) * u2 + (-p0[c] + 3 * p1[c] - 3 * p2[c] + p3[c]) * u3));
      pts.push(q); times.push(lerp(keys[i].t, keys[i + 1].t, E.sine(u) * 0.35 + u * 0.65));
    }
  }
  pts.push(keys[keys.length - 1].p); times.push(keys[keys.length - 1].t);
  return { pts, times };
}
const W_ = (id, u, v) => uvw(P[id], u, v);
const PATH_C = mkPath([
  { t: 10.25, p: W_("walk", 0.02, 0.745) }, { t: 11.0, p: W_("walk", 0.31, 0.735) }, { t: 11.6, p: W_("walk", 0.62, 0.712) },
  { t: 12.0, p: W_("walk", 0.86, 0.705) }, { t: 12.55, p: W_("climb", 0.24, 0.655) }, { t: 13.0, p: W_("climb", 0.43, 0.60) },
  { t: 13.6, p: W_("climb", 0.70, 0.50) }, { t: 14.0, p: W_("climb", 0.86, 0.43) }, { t: 14.55, p: W_("summit", 0.25, 0.47) },
  { t: 15.0, p: W_("summit", 0.505, 0.49) }, { t: 15.8, p: [9900, -60, 11400] }, { t: 16.6, p: [10350, 12, 11300] },
  ...Array.from({ length: 12 }, (_, i) => ({ t: 16.75 + 0.25 * i, p: [10180 + 150 * i + 59, 12, 11300] })),
  { t: 20.1, p: [12150, 12, 11300] },
]);
const MILESTONES = [
  { t: 11.0, name: "LANCEMENT", p: W_("walk", 0.31, 0.735) },
  { t: 12.0, name: "STRATÉGIE", p: W_("walk", 0.86, 0.705) },
  { t: 13.0, name: "CRÉATION", p: W_("climb", 0.43, 0.60) },
  { t: 14.0, name: "CROISSANCE", p: W_("climb", 0.86, 0.43) },
  { t: 15.0, name: "OBJECTIF ATTEINT", p: W_("summit", 0.505, 0.49), last: true },
];
// Crête du Cervin (pixels de la photo 3200×2134) → monde
const RIDGE = [[1280,1101],[1300,1079],[1320,1065],[1340,1036],[1360,1029],[1380,995],[1400,971],[1420,957],[1440,929],[1460,905],[1480,889],[1500,877],[1520,869],[1540,812],[1560,784],[1570,780],[1580,782],[1600,798],[1620,835],[1640,852],[1660,866],[1680,918],[1700,930],[1720,1004],[1740,1030],[1760,1036],[1780,1057],[1800,1082],[1820,1109],[1840,1130],[1860,1150],[1880,1152]];
const RIDGE_W = RIDGE.map(([x, y]) => W_("peak", x / 3200, (y - 6) / 2134));
const RIDGE_APEX = 15;
const ridgeT = i => i <= RIDGE_APEX ? lerp(20.45, 21.3, E.sine(i / RIDGE_APEX) * .3 + (i / RIDGE_APEX) * .7) : lerp(21.3, 21.72, (i - RIDGE_APEX) / (RIDGE_W.length - 1 - RIDGE_APEX));

/* ---------------------------- Logo (espace écran) ---------------------------- */
const LS = 0.355, LCX = 960, LCY = 548;
const lpx = (px, py) => [LCX + (px - 2322) * LS, LCY + (py - 1551) * LS];
const A_OUT = [lpx(1741, 1498), lpx(2322, 299), lpx(2903, 1498)];
const LOGO = {};
[["icon", 1729, 287, 1187, 1224], ["empira", 949, 1786, 2747, 413], ["agency", 288, 2381, 4069, 160], ["tagline", 288, 2688, 4069, 127]].forEach(([n, px, py, w, h]) => {
  const [x, y] = lpx(px, py), im = document.createElement("img"); im.src = `assets/logo-${n}.png`; im.className = "lp";
  Object.assign(im.style, { left: x + "px", top: y + "px", width: w * LS + "px", height: h * LS + "px", opacity: 0 }); $("logo").appendChild(im); LOGO[n] = im;
  if (n === "icon") { const s = document.createElement("div"); s.id = "sweep"; Object.assign(s.style, { left: x + "px", top: y + "px", width: w * LS + "px", height: h * LS + "px", opacity: 0 }); $("logo").appendChild(s); LOGO.sweep = s; }
});
const cta = document.createElement("div"); cta.id = "cta"; cta.className = "blk c"; cta.textContent = "REJOINS L'AVENTURE";
Object.assign(cta.style, { left: LCX + "px", top: (lpx(0, 2803)[1] + 46) + "px", opacity: 0 }); $("logo").appendChild(cta);

/* ---------------------------- Textes ---------------------------- */
const TEXTS = [];
function text(cls, html, x, y, t0, t1, o = {}) {
  const d = document.createElement("div"); d.className = "blk " + cls + (o.center ? " c" : ""); d.style.left = x + "px"; d.style.top = y + "px";
  const words = []; html.replace(/<g>(.*?)<\/g>|([^<]+)/g, (m, g, plain) => { (g || plain).trim().split(/\s+/).forEach(w => w && words.push({ w, gold: !!g })); });
  words.forEach((o2, i) => { const s = document.createElement("span"); s.className = "w" + (o2.gold ? " gold" : ""); s.textContent = o2.w; d.appendChild(s); if (i < words.length - 1) d.appendChild(document.createTextNode(" ")); });
  $("hud").appendChild(d);
  const T = { el: d, spans: [...d.querySelectorAll(".w")], t0, t1, stag: o.stag ?? 0.07, dur: o.dur ?? 0.8, out: o.out ?? 0.5, fly: o.fly, follow: o.follow };
  TEXTS.push(T); return T;
}
const TX = 150, TY = 760;
// accroche (traversée par la caméra à ~3 s)
text("hook", "Tu crées du contenu ?", 960, 395, 0.6, 3.05, { center: true, fly: true });
text("hook", "<g>Passe au niveau supérieur.</g>", 960, 490, 1.7, 3.05, { center: true, stag: 0.09, fly: true });
// 01
text("label", "01 — ÉQUIPEMENT", TX + 2, TY, 4.45, 8.2, { stag: 0.05 });
text("h1", "Équipe-toi <g>comme un pro.</g>", TX, TY + 36, 4.65, 8.2);
text("sub", "On t'accompagne dans l'achat de ton matériel.", TX + 2, TY + 128, 6.5, 8.2, { stag: 0.045 });
// 02
text("label", "02 — ACCOMPAGNEMENT", TX + 2, TY, 10.35, 15.5, { stag: 0.05 });
text("h1", "De tes débuts <g>à tes objectifs.</g>", TX, TY + 36, 10.55, 15.5);
text("sub", "Un suivi sur-mesure, étape par étape.", TX + 2, TY + 128, 11.3, 15.5, { stag: 0.05 });
// 03
text("label", "03 — ÉVÉNEMENTS", TX + 2, TY, 16.25, 19.3, { stag: 0.05 });
text("h1", "Un événement <g>chaque mois.</g>", TX, TY + 36, 16.45, 19.3);
text("sub", "Rencontre d'autres créateurs et développe ton réseau.", TX + 2, TY + 128, 17.6, 19.3, { stag: 0.045 });

// Légendes produits (ancrées sur les photos)
const CALLS = [
  { name: "CAMÉRA", p: () => W_("camera", 0.47, 0.47), t0: 5.0, t1: 6.25, dir: -1 },
  { name: "MICRO", p: () => W_("mic", 0.70, 0.30), t0: 6.75, t1: 7.85 },
  { name: "LUMIÈRE", p: () => W_("ring", 0.74, 0.42), t0: 8.25, t1: 9.0 },

// Cartes du calendrier (3D, plan z = 10960)

/* ---------------------------- Poussière d'or 3D ---------------------------- */
const DUST = (() => { const r = rng(11), a = []; for (let i = 0; i < 1300; i++) a.push({ x: -1500 + r() * 15000, y: -1900 + r() * 3200, z: 300 + r() * 15500, s: 0.6 + r() * 2.2, ph: r() * 6.28, sp: .4 + r(), vx: (r() - .5) * 14, vy: -6 - r() * 14 }); return a; })();

/* ---------------------------- Rendu ---------------------------- */
function planeState(p, t, c) {

    case "lens": o = E.sine(prog(t, 0.9, 2.6)) * 0.95 + 0.05 * prog(t, 0.2, 0.9); bright = 0.75 + 0.6 * bell(t, 3.3, 4.0, 4.3); break;
    case "camera": o = E.sine(prog(t, 3.9, 4.6)); break;
    case "mic": o = E.sine(prog(t, 5.75, 6.4)); break;
    case "ring": o = E.sine(prog(t, 7.15, 7.8)); bright = t < 8.05 ? 0.07 : (t < 8.45 ? ((Math.sin(t * 95) > 0.2 ? 1 : 0.25) * lerp(.4, 1, prog(t, 8.05, 8.45))) : 1 + 0.9 * prog(t, 9.0, 9.9)); break;

    case "crowd": o = E.sine(prog(t, 9.75, 10.5)); bright = 1 + 1.5 * E.in2(prog(t, 19.4, 20.25)); break;
    case "bokeh": o = bell(t, 19.7, 20.25, 20.95) * 0.9; blur = 3; break;

  return { o, blur, bright };
}

function drawPlanes(t, c) {
  $("cam").style.transform = `rotate(${c.r}rad)`;
  for (const id in P) {
    const p = P[id], d = p.z - c.z;
    const st = d > 1 ? planeState(p, t, c) : { o: 0 };
    if (st.o <= 0.003) { p.el.style.display = "none"; continue; }
    const s = F / d, sx = W / 2 + (p.x - c.x) * s, sy = H / 2 + (p.y - c.y) * s;

    p.el.style.transform = `translate(${sx.toFixed(2)}px,${sy.toFixed(2)}px) scale(${s.toFixed(5)})`;
    p.el.style.opacity = st.o.toFixed(3);

}

function drawBg(t, c) {

  g.addColorStop(0, "#120d08"); g.addColorStop(.6, "#070504"); g.addColorStop(1, "#020202");

function strokePath(ctx, pts, c, upto, width, alpha) {

function drawFx(t, c) {

      // étoile
      const cx2 = a[0] + w / 2, cy2 = a[1] + h * .64, ss = (lit > 0 ? E.outBack(clamp(lit)) : 0) * a[2];
      if (ss > 0) { fx.save(); fx.translate(cx2, cy2); fx.rotate((lit - 1) * 0.6); fx.scale(ss, ss); fx.beginPath(); for (let k2 = 0; k2 < 8; k2++) { const a2 = -Math.PI / 2 + k2 * Math.PI / 4, rr = k2 % 2 ? 5.5 : 19; fx.lineTo(Math.cos(a2) * rr, Math.sin(a2) * rr); } fx.closePath(); fx.fillStyle = "#F6D58E"; fx.shadowColor = "rgba(240,180,80,1)"; fx.shadowBlur = 16; fx.fill(); fx.restore(); }
      else { fx.fillStyle = "rgba(201,138,46,.5)"; fx.beginPath(); fx.arc(cx2, cy2, 3.5 * a[2], 0, 6.283); fx.fill(); }
      fx.globalAlpha = 1;
    }
    if (head) {
      trail(fx, e => { const q = proj(camera(e), ...pathAt(PATH_C, e).p); return q; }, t, 10.3, 20.0);
      spark(fx, head[0], head[1], 30 * (1 + .1 * Math.sin(t * 9)), al);
    }
    // la scène / la lumière qui avale la caméra
    const st = proj(c, ...W_("crowd", 0.45, 0.22)); if (st) flare(fx, st[0], st[1], E.in2(prog(t, 18.8, 20.2)) * (1 - prog(t, 20.2, 20.5)), 1300);
    const hl = proj(c, ...W_("summit", 0.505, 0.49)); if (hl) flare(fx, hl[0], hl[1], bell(t, 14.6, 15.1, 16.2) * .7, 900);
  }

  // --- E : la crête du Cervin, puis le « A »
  if (t > 20.3 && t < 22.6) {
    let n = 0; for (let i = 0; i < RIDGE_W.length; i++) if (ridgeT(i) <= t) n = i;
    let upto = n; if (n < RIDGE_W.length - 1) upto = n + clamp((t - ridgeT(n)) / (ridgeT(n + 1) - ridgeT(n)));
    const morph = E.inOut(prog(t, 21.72, 22.0)), fadeL = 1 - prog(t, 22.0, 22.25);
    if (morph <= 0) {
      const head = strokePath(fx, RIDGE_W, c, upto, 3.2, 1);
      if (head && t < 21.75) { trail(fx, e => { let n2 = 0; for (let i = 0; i < RIDGE_W.length; i++) if (ridgeT(i) <= e) n2 = i; return proj(camera(e), ...RIDGE_W[n2]); }, t, 20.5, 21.72); spark(fx, head[0], head[1], 32); }
    } else {
      // morphing : crête projetée → contour du A du logo (espace écran, sans roulis)
      fx.setTransform(1, 0, 0, 1, 0, 0);
      const N = 120, src = resample(RIDGE_W.map(p => { const q = proj(c, ...p); return rollPt(c, q); }), N), dst = resample(A_OUT, N);
      const path = new Path2D(); for (let i = 0; i < N; i++) { const x = lerp(src[i][0], dst[i][0], morph), y = lerp(src[i][1], dst[i][1], morph); i ? path.lineTo(x, y) : path.moveTo(x, y); }
      fx.lineJoin = fx.lineCap = "round"; fx.globalAlpha = .55 * fadeL; fx.strokeStyle = "#E8B65C"; fx.lineWidth = 10; fx.shadowColor = "rgba(240,180,80,1)"; fx.shadowBlur = 26; fx.stroke(path);
      fx.shadowBlur = 0; fx.globalAlpha = fadeL; fx.strokeStyle = "#F6D58E"; fx.lineWidth = 3.4; fx.stroke(path); fx.globalAlpha = 1;
      spark(fx, lerp(src[N - 1][0], dst[N - 1][0], morph), lerp(src[N - 1][1], dst[N - 1][1], morph), 30 * fadeL);
    }
  }
  fx.setTransform(1, 0, 0, 1, 0, 0);
}
function resample(pts, N) {
  const L = [0]; for (let i = 1; i < pts.length; i++) L.push(L[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const out = []; let j = 0;
  for (let k = 0; k < N; k++) { const d = L[L.length - 1] * k / (N - 1); while (j < L.length - 2 && L[j + 1] < d) j++; const u = (d - L[j]) / Math.max(1e-6, L[j + 1] - L[j]); out.push([lerp(pts[j][0], pts[j + 1][0], u), lerp(pts[j][1], pts[j + 1][1], u)]); }
  return out;
}

function drawText(t, c) {
  for (const T of TEXTS) {
    const outU = prog(t, T.t1, T.t1 + T.out);
    T.spans.forEach((s, i) => {
      const u = prog(t, T.t0 + i * T.stag, T.t0 + i * T.stag + T.dur), e = E.out(u);
      let op = e * (1 - E.sine(outU)), ty = (1 - e) * 34, blur = (1 - E.out4(u)) * 12 + outU * 10;
      s.style.opacity = op.toFixed(3);
      s.style.transform = `translateY(${ty.toFixed(2)}px)`;
      s.style.filter = blur > .05 ? `blur(${blur.toFixed(2)}px)` : "none";
    });
    if (T.fly) { // la phrase est traversée par la caméra
      const fly = E.in2(prog(t, 3.0, 3.6)), sc = 1 + fly * 2.6;
      const yOff = (parseFloat(T.el.style.top) - H / 2) * (sc - 1);
      T.el.style.transform = `translateX(-50%) translateY(${yOff.toFixed(1)}px) scale(${sc.toFixed(3)})`;
    }
  }
}

function drawOverlays(t, c) {
  // grande lumière (traversées)
  const blo = $("bloom");
  let k = 0, bx = W / 2, by = H / 2;
  const lens = bell(t, 3.75, 4.12, 4.6); if (lens > k) { k = lens; const q = proj(c, 0, 0, 4000); if (q) { bx = q[0]; by = q[1]; } }
  const ring = bell(t, 9.3, 9.95, 10.75); if (ring > k) { k = ring; bx = W / 2; by = H / 2; }
  const stage = bell(t, 19.55, 20.2, 20.75); if (stage > k) { k = stage; bx = W / 2; by = H / 2; }
  blo.style.opacity = k.toFixed(3);
  blo.style.background = `radial-gradient(circle at ${bx.toFixed(0)}px ${by.toFixed(0)}px, rgba(255,248,230,1) 0%, rgba(255,226,165,.92) ${(18 + 40 * k).toFixed(0)}%, rgba(214,150,60,.55) ${(45 + 40 * k).toFixed(0)}%, rgba(120,70,20,${(.3 * k).toFixed(2)}) 100%)`;
  // fuite de lumière chaude qui balaye pendant les mouvements
  const lk = Math.max(bell(t, 5.9, 6.3, 6.9), bell(t, 7.4, 7.8, 8.3), bell(t, 15.3, 15.8, 16.5)) * .35;
  const lx = ((t * 260) % 2600) - 400;
  $("leak").style.opacity = lk.toFixed(3);
  $("leak").style.background = `radial-gradient(ellipse 600px 900px at ${lx.toFixed(0)}px 40%, rgba(255,180,80,.55), rgba(255,140,40,0) 70%)`;
  // impact logo
  const imp = 22.0, fl = prog(t, imp - .03, imp + .6), fa = fl > 0 && fl < 1 ? Math.pow(1 - fl, 2.2) : 0;
  $("flash").style.opacity = fa.toFixed(3);
  $("flash").style.background = `radial-gradient(circle at 960px ${lpx(0, 900)[1].toFixed(0)}px, rgba(255,246,222,.95) 0%, rgba(240,190,100,.55) 18%, rgba(160,100,30,.12) 45%, rgba(0,0,0,0) 70%)`;
  // bandes cinéma 2.25:1 → plein cadre à l'impact
  const bh = 102 * (1 - E.inOut(prog(t, 22.0, 23.2)));
  $("barT").style.height = $("barB").style.height = bh.toFixed(1) + "px";
  const sc = Math.max(bell(t, 4.3, 4.9, 8.6), bell(t, 10.2, 10.8, 15.9), bell(t, 16.0, 16.6, 20.0));
  $("scrim").style.opacity = sc.toFixed(3);
  $("fade").style.opacity = Math.max(1 - E.out(prog(t, 0, 1.0)), E.in(prog(t, 29.3, 30))).toFixed(3);
}

function drawLogo(t) {
  const imp = 22.0, fill = prog(t, imp - .05, imp + .14);
  LOGO.icon.style.opacity = E.out(fill).toFixed(3);
  LOGO.icon.style.transformOrigin = "50% 100%";
  LOGO.icon.style.transform = `scale(${(1 + .06 * (1 - E.out(prog(t, imp, imp + .8)))).toFixed(4)})`;
  const sw = prog(t, imp + .5, imp + 1.4); LOGO.sweep.style.opacity = sw > 0 && sw < 1 ? 1 : 0; LOGO.sweep.style.backgroundPosition = `${(100 - sw * 100).toFixed(2)}% 0`;
  const rev = (el, a, b, mode) => {
    const u = E.inOut(prog(t, a, b)); el.style.opacity = u > 0 ? 1 : 0;
    if (mode === "lr") { const X = -15 + u * 130; el.style.webkitMaskImage = el.style.maskImage = `linear-gradient(90deg,#000 ${X - 15}%,transparent ${X}%)`; }
    else { const X = u * 62; el.style.webkitMaskImage = el.style.maskImage = `linear-gradient(90deg,transparent ${50 - X - 12}%,#000 ${50 - X}%,#000 ${50 + X}%,transparent ${50 + X + 12}%)`; }
    el.style.transform = `translateY(${((1 - E.out(prog(t, a, b))) * 14).toFixed(2)}px)`;
  };
  rev(LOGO.empira, imp + .45, imp + 1.6, "lr"); rev(LOGO.agency, imp + 1.25, imp + 2.3, "c"); rev(LOGO.tagline, imp + 2.0, imp + 3.3, "c");
  const ct = E.out(prog(t, 27.0, 27.9)); cta.style.opacity = ct.toFixed(3); cta.style.letterSpacing = (0.62 - .12 * ct).toFixed(3) + "em";
}

function drawGrain(frame) { const r = rng(frame * 7919 + 13), d = grainImg.data; for (let i = 0; i < d.length; i += 4) { const v = r() * 255; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; } gc.putImageData(grainImg, 0, 0); }

function seek(t) {
  const c = camera(t);
  drawBg(t, c); drawPlanes(t, c); drawFx(t, c); drawText(t, c); drawOverlays(t, c); drawLogo(t); drawGrain(Math.floor(t * 30));
}
window.seek = seek; window.DUR = DUR;

const render = new URLSearchParams(location.search).has("render");
if (render) document.body.classList.add("render");
window.ready = (async () => {
  await document.fonts.load('300 40px "Montserrat"'); await document.fonts.load('500 40px "Montserrat"'); await document.fonts.ready;
  await Promise.all([...document.images].map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })));
  await Promise.all([...document.images].map(im => im.decode ? im.decode().catch(() => 0) : 0));
  seek(0); return true;
})();
if (!render) {
  const fit = () => { const s = Math.min(innerWidth / W, innerHeight / H); $("stage").style.transform = `scale(${s})`; };
  addEventListener("resize", fit); fit();
  const audio = new Audio("out/empira-mix.wav"); let playing = false, t0 = 0, start = 0;
  const tick = () => { if (!playing) return; let t = audio.readyState > 2 && !audio.paused ? audio.currentTime : (performance.now() - start) / 1000 + t0; if (t >= DUR) { playing = false; t = DUR; $("play").textContent = "▶ Lecture"; } seek(t); $("scrub").value = t; $("tc").textContent = t.toFixed(2).padStart(5, "0"); requestAnimationFrame(tick); };
  $("play").onclick = () => { playing = !playing; $("play").textContent = playing ? "❚❚ Pause" : "▶ Lecture"; if (playing) { t0 = +$("scrub").value; if (t0 >= DUR - .05) t0 = 0; start = performance.now(); audio.currentTime = t0; audio.play().catch(() => {}); tick(); } else audio.pause(); };
  $("scrub").oninput = e => { const t = +e.target.value; audio.currentTime = t; t0 = t; start = performance.now(); seek(t); $("tc").textContent = t.toFixed(2).padStart(5, "0"); };
}
</script>
