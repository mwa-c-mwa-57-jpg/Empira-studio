  { const q = proj(c, ...W_("phone", 0.60, 0.42)); if (q) flare(fx, q[0], q[1], bell(t, 5.05, 5.1, 5.45) * .9, 700); }   // flash « enregistrement »
  { const q = proj(c, ...W_("ring", 0.49, 0.62)); if (q) flare(fx, q[0], q[1], (t > 8.5 ? (t < 8.85 ? (Math.sin(t * 95) > .2 ? .7 : .1) : .45 + .5 * prog(t, 9.1, 9.9)) : 0) * (1 - prog(t, 9.9, 10.2)), 1200); }

  // C/D/E : chemin du coaching, gaming, calendrier
  MILE_EL.forEach(el => el.style.opacity = 0); LIVE.style.opacity = 0;
  if (t > 10.2 && t < 20.6) {
    const al = E.sine(prog(t, 10.2, 10.6)) * (1 - E.out(prog(t, 19.4, 19.85)));
    const sp = pathAt(PATH_C, t), head = strokePath(fx, PATH_C.pts, c, sp.i, 3.0, al);
    MILESTONES.forEach((m, k) => {
      const q = proj(c, ...m.p); if (!q) { MILE_EL[k].style.opacity = 0; return; }
      const on = prog(t, m.t - .05, m.t + .4), ring = E.out(prog(t, m.t - .5, m.t));
      fx.globalAlpha = al * ring; fx.strokeStyle = "#F0C066"; fx.lineWidth = 2.2;
      fx.beginPath(); fx.arc(q[0], q[1], m.last ? 22 : 15, -Math.PI / 2, -Math.PI / 2 + ring * 6.283); fx.stroke();
      fx.fillStyle = "rgba(10,8,6,.6)"; fx.beginPath(); fx.arc(q[0], q[1], (m.last ? 20 : 13) * ring, 0, 6.283); fx.fill();
      if (on > 0) {
        const s = E.outBack(on);
        if (m.last) { fx.save(); fx.translate(q[0], q[1]); fx.scale(s, s); fx.beginPath(); for (let k2 = 0; k2 < 10; k2++) { const a2 = -Math.PI / 2 + k2 * Math.PI / 5, rr = k2 % 2 ? 6 : 15; fx.lineTo(Math.cos(a2) * rr, Math.sin(a2) * rr); } fx.closePath(); fx.fillStyle = "#F6D58E"; fx.shadowColor = "rgba(240,180,80,1)"; fx.shadowBlur = 18; fx.fill(); fx.restore(); }
        else { fx.fillStyle = "#F6D58E"; fx.shadowColor = "rgba(240,180,80,1)"; fx.shadowBlur = 14; fx.beginPath(); fx.arc(q[0], q[1], 6.5 * s, 0, 6.283); fx.fill(); fx.shadowBlur = 0; }
        const pq = prog(t, m.t, m.t + 1.1); if (pq < 1) { fx.globalAlpha = al * (1 - pq) * .8; fx.beginPath(); fx.arc(q[0], q[1], 15 + 70 * E.out(pq), 0, 6.283); fx.strokeStyle = "#F0C066"; fx.lineWidth = 1.6; fx.stroke(); }
      }
      fx.globalAlpha = 1;
      placeLabel(MILE_EL[k], c, q[0], q[1], 26, 22, al * E.out(prog(t, m.t + .05, m.t + .5)) * (1 - prog(t, 14.6, 15.2)));
    });
    // badge LIVE sur l'écran du setup gaming
    { const q = proj(c, ...W_("gaming", 0.47, 0.545)), a = E.outBack(prog(t, 15.25, 15.65)) * (1 - E.out(prog(t, 17.3, 17.7)));
      if (q && a > 0) { const rp = rollPt(c, [q[0], q[1]]); LIVE.style.opacity = clamp(a).toFixed(3); LIVE.style.transform = `translate(${rp[0].toFixed(1)}px,${rp[1].toFixed(1)}px) translate(-50%,-50%) scale(${(.7 + .3 * a).toFixed(3)})`; LIVE.style.filter = `brightness(${(1 + .25 * Math.sin(t * 7)).toFixed(3)})`; } else LIVE.style.opacity = 0; }
    // cartes du calendrier
    for (let i = 0; i < 12; i++) {
      const lt = CARD_T(i), app = E.out(prog(t, 17.6 + i * .03, 18.2 + i * .03)) * (1 - E.out(prog(t, 19.5, 20.0)));
      if (app <= 0) continue;
      const lit = E.out(prog(t, lt - .03, lt + .3)), X = CARD.x0 + CARD.step * i, Y = CARD.y - 10 * lit + (1 - app) * 40;
      const a = proj(c, X, Y, CARD.z), b = proj(c, X + CARD.w, Y + CARD.h, CARD.z); if (!a || !b) continue;
      const w = b[0] - a[0], h = b[1] - a[1], r = 14 * a[2];
      fx.globalAlpha = app; fx.fillStyle = lit > .05 ? `rgba(30,22,12,${.55 + .2 * lit})` : "rgba(12,10,8,.55)";
      fx.beginPath(); fx.roundRect(a[0], a[1], w, h, r); fx.fill();
      fx.lineWidth = 1.4 + 1.4 * lit; fx.strokeStyle = lit > .05 ? `rgba(240,192,102,${.4 + .6 * lit})` : "rgba(201,138,46,.35)";
      if (lit > .05) { fx.shadowColor = "rgba(240,180,80,.9)"; fx.shadowBlur = 20 * lit; }
      fx.stroke(); fx.shadowBlur = 0;
      fx.font = `500 ${(19 * a[2]).toFixed(1)}px Montserrat`; fx.textAlign = "center"; fx.fillStyle = lit > .5 ? "#F6F1E7" : "#9b8f7c";
      fx.letterSpacing = (4 * a[2]).toFixed(1) + "px"; fx.fillText(MONTHS[i], a[0] + w / 2 + 2 * a[2], a[1] + 42 * a[2]); fx.letterSpacing = "0px";
      const cx2 = a[0] + w / 2, cy2 = a[1] + h * .64, ss = (lit > 0 ? E.outBack(clamp(lit)) : 0) * a[2];
      if (ss > 0) { fx.save(); fx.translate(cx2, cy2); fx.rotate((lit - 1) * 0.6); fx.scale(ss, ss); fx.beginPath(); for (let k2 = 0; k2 < 8; k2++) { const a2 = -Math.PI / 2 + k2 * Math.PI / 4, rr = k2 % 2 ? 5.5 : 19; fx.lineTo(Math.cos(a2) * rr, Math.sin(a2) * rr); } fx.closePath(); fx.fillStyle = "#F6D58E"; fx.shadowColor = "rgba(240,180,80,1)"; fx.shadowBlur = 16; fx.fill(); fx.restore(); }
      else { fx.fillStyle = "rgba(201,138,46,.5)"; fx.beginPath(); fx.arc(cx2, cy2, 3.5 * a[2], 0, 6.283); fx.fill(); }
      fx.globalAlpha = 1;
    }
    if (head) { trail(fx, e => proj(camera(e), ...pathAt(PATH_C, e).p), t, 10.3, 19.8); spark(fx, head[0], head[1], 30 * (1 + .1 * Math.sin(t * 9)), al); }
    const st = proj(c, ...W_("crowd", 0.45, 0.22)); if (st) flare(fx, st[0], st[1], E.in2(prog(t, 18.9, 20.2)) * (1 - prog(t, 20.2, 20.5)), 1300);
    const hl = proj(c, ...W_("summit", 0.505, 0.49)); if (hl) flare(fx, hl[0], hl[1], bell(t, 13.4, 13.85, 14.8) * .7, 900);
  }

  // F : la crête du Cervin, puis le « A »
  if (t > 20.3 && t < 22.6) {
    let n = 0; for (let i = 0; i < RIDGE_W.length; i++) if (ridgeT(i) <= t) n = i;
    let upto = n; if (n < RIDGE_W.length - 1) upto = n + clamp((t - ridgeT(n)) / (ridgeT(n + 1) - ridgeT(n)));
    const morph = E.inOut(prog(t, 21.72, 22.0)), fadeL = 1 - prog(t, 22.0, 22.25);
    if (morph <= 0) {
      const head = strokePath(fx, RIDGE_W, c, upto, 3.2, 1);
      if (head && t < 21.75) { trail(fx, e => { let n2 = 0; for (let i = 0; i < RIDGE_W.length; i++) if (ridgeT(i) <= e) n2 = i; return proj(camera(e), ...RIDGE_W[n2]); }, t, 20.5, 21.72); spark(fx, head[0], head[1], 32); }
    } else {
      fx.setTransform(1, 0, 0, 1, 0, 0);
      const N = 120, src = resample(RIDGE_W.map(p => rollPt(c, proj(c, ...p))), N), dst = resample(A_OUT, N);
      const path = new Path2D(); for (let i = 0; i < N; i++) { const x = lerp(src[i][0], dst[i][0], morph), y = lerp(src[i][1], dst[i][1], morph); i ? path.lineTo(x, y) : path.moveTo(x, y); }
      fx.lineJoin = fx.lineCap = "round"; fx.globalAlpha = .55 * fadeL; fx.strokeStyle = "#E8B65C"; fx.lineWidth = 10; fx.shadowColor = "rgba(240,180,80,1)"; fx.shadowBlur = 26; fx.stroke(path);
      fx.shadowBlur = 0; fx.globalAlpha = fadeL; fx.strokeStyle = "#F6D58E"; fx.lineWidth = 3.4; fx.stroke(path); fx.globalAlpha = 1;
      spark(fx, lerp(src[N - 1][0], dst[N - 1][0], morph), lerp(src[N - 1][1], dst[N - 1][1], morph), 30 * fadeL);
    }
  }
  fx.setTransform(1, 0, 0, 1, 0, 0);
}

function drawText(t) {
  for (const T of TEXTS) {
    const outU = prog(t, T.t1, T.t1 + T.out);
    T.spans.forEach((s, i) => {
      const u = prog(t, T.t0 + i * T.stag, T.t0 + i * T.stag + T.dur), e = E.out(u);
      s.style.opacity = (e * (1 - E.sine(outU))).toFixed(3);
      s.style.transform = `translateY(${((1 - e) * 34).toFixed(2)}px)`;
      const blur = (1 - E.out4(u)) * 12 + outU * 10; s.style.filter = blur > .05 ? `blur(${blur.toFixed(2)}px)` : "none";
    });
    if (T.fly) { const sc = 1 + E.in2(prog(t, 3.0, 3.6)) * 2.6, yOff = (parseFloat(T.el.style.top) - H / 2) * (sc - 1); T.el.style.transform = `translateX(-50%) translateY(${yOff.toFixed(1)}px) scale(${sc.toFixed(3)})`; }
  }
}

function drawOverlays(t, c) {
  let k = 0, bx = W / 2, by = H / 2;
  const lens = bell(t, 3.75, 4.12, 4.6); if (lens > k) { k = lens; const q = proj(c, ...LENS_C); if (q) { bx = q[0]; by = q[1]; } }
  const ring = bell(t, 9.3, 9.95, 10.75); if (ring > k) { k = ring; bx = W / 2; by = H / 2; }
  const stage = bell(t, 19.6, 20.25, 20.8); if (stage > k) { k = stage; bx = W / 2; by = H / 2; }
  const R = Math.max(W, H);
  $("bloom").style.opacity = k.toFixed(3);
  $("bloom").style.background = `radial-gradient(circle ${R}px at ${bx.toFixed(0)}px ${by.toFixed(0)}px, rgba(255,248,230,1) 0%, rgba(255,226,165,.92) ${(18 + 40 * k).toFixed(0)}%, rgba(214,150,60,.55) ${(45 + 40 * k).toFixed(0)}%, rgba(120,70,20,${(.3 * k).toFixed(2)}) 100%)`;
  const lk = Math.max(bell(t, 5.5, 5.9, 6.5), bell(t, 6.7, 7.1, 7.6), bell(t, 7.95, 8.3, 8.8), bell(t, 14.2, 14.7, 15.3), bell(t, 17.2, 17.7, 18.3)) * .35, lx = ((t * 260) % (W + 700)) - 350;
  $("leak").style.opacity = lk.toFixed(3);
  $("leak").style.background = `radial-gradient(ellipse ${pick(500, 600)}px ${pick(1300, 900)}px at ${lx.toFixed(0)}px 40%, rgba(255,180,80,.55), rgba(255,140,40,0) 70%)`;
  const imp = 22.0, fl = prog(t, imp - .03, imp + .6), fa = fl > 0 && fl < 1 ? Math.pow(1 - fl, 2.2) : 0;
  $("flash").style.opacity = fa.toFixed(3);
  $("flash").style.background = `radial-gradient(circle ${R}px at ${LCX}px ${lpx(0, 900)[1].toFixed(0)}px, rgba(255,246,222,.95) 0%, rgba(240,190,100,.55) 18%, rgba(160,100,30,.12) 45%, rgba(0,0,0,0) 70%)`;
  const bh = V ? 0 : 102 * (1 - E.inOut(prog(t, 22.0, 23.2)));
  $("barT").style.height = $("barB").style.height = bh.toFixed(1) + "px";
  const sc = Math.max(...SECTIONS.map(s => bell(t, s[3] - 0.1, s[3] + 0.5, s[4] + 0.6)));
  $("scrim").style.opacity = sc.toFixed(3);
  $("fade").style.opacity = Math.max(1 - E.out(prog(t, 0, 1.0)), E.in(prog(t, 29.3, 30))).toFixed(3);
}

function drawLogo(t) {
  const imp = 22.0, fill = prog(t, imp - .05, imp + .14);
  LOGO.icon.style.opacity = E.out(fill).toFixed(3); LOGO.icon.style.transformOrigin = "50% 100%";
  LOGO.icon.style.transform = `scale(${(1 + .06 * (1 - E.out(prog(t, imp, imp + .8)))).toFixed(4)})`;
  const sw = prog(t, imp + .5, imp + 1.4); LOGO.sweep.style.opacity = sw > 0 && sw < 1 ? 1 : 0; LOGO.sweep.style.backgroundPosition = `${(100 - sw * 100).toFixed(2)}% 0`;
  const rev = (el, a, b, mode) => {
    const u = E.inOut(prog(t, a, b)); el.style.opacity = u > 0 ? 1 : 0;
    if (mode === "lr") { const X = -15 + u * 130; el.style.webkitMaskImage = el.style.maskImage = `linear-gradient(90deg,#000 ${X - 15}%,transparent ${X}%)`; }
    else { const X = u * 62; el.style.webkitMaskImage = el.style.maskImage = `linear-gradient(90deg,transparent ${50 - X - 12}%,#000 ${50 - X}%,#000 ${50 + X}%,transparent ${50 + X + 12}%)`; }
    el.style.transform = `translateY(${((1 - E.out(prog(t, a, b))) * 14).toFixed(2)}px)`;
  };
  rev(LOGO.empira, imp + .45, imp + 1.6, "lr"); rev(LOGO.agency, imp + 1.25, imp + 2.3, "c"); rev(LOGO.tagline, imp + 2.0, imp + 3.3, "c");
  CTA.forEach((el, i) => { const u = E.out(prog(t, 26.2 + i * 0.25, 27.0 + i * 0.25)); el.style.opacity = u.toFixed(3); el.style.transform = `translateX(-50%) translateY(${((1 - u) * 18).toFixed(1)}px)`; el.style.filter = u < 1 ? `blur(${((1 - u) * 8).toFixed(2)}px)` : "none"; });
}

function drawGrain(frame) { const r = rng(frame * 7919 + 13), d = grainImg.data; for (let i = 0; i < d.length; i += 4) { const v = r() * 255; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; } gc.putImageData(grainImg, 0, 0); }

function seek(t) { const c = camera(t); drawBg(t, c); drawPlanes(t, c); drawFx(t, c); drawText(t); drawOverlays(t, c); drawLogo(t); drawGrain(Math.floor(t * 30)); }
window.seek = seek; window.DUR = DUR;

const render = Q.has("render");
if (render) document.body.classList.add("render");
window.ready = (async () => {
  await document.fonts.load('300 40px "Montserrat"'); await document.fonts.load('500 40px "Montserrat"'); await document.fonts.load('600 40px "Montserrat"'); await document.fonts.ready;
  await Promise.all([...document.images].map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })));
  await Promise.all([...document.images].map(im => im.decode ? im.decode().catch(() => 0) : 0));
  seek(0); return true;
})();
if (!render) {
  const fit = () => { const s = Math.min(innerWidth / W, (innerHeight - 70) / H); $("stage").style.transform = `scale(${s})`; };
  addEventListener("resize", fit); fit();
  const audio = new Audio("out/empira-mix.wav"); let playing = false, t0 = 0, start = 0;
  const tick = () => { if (!playing) return; let t = audio.readyState > 2 && !audio.paused ? audio.currentTime : (performance.now() - start) / 1000 + t0; if (t >= DUR) { playing = false; t = DUR; $("play").textContent = "▶ Lecture"; } seek(t); $("scrub").value = t; $("tc").textContent = t.toFixed(2).padStart(5, "0"); requestAnimationFrame(tick); };
  $("play").onclick = () => { playing = !playing; $("play").textContent = playing ? "❚❚ Pause" : "▶ Lecture"; if (playing) { t0 = +$("scrub").value; if (t0 >= DUR - .05) t0 = 0; start = performance.now(); audio.currentTime = t0; audio.play().catch(() => {}); tick(); } else audio.pause(); };
  $("scrub").oninput = e => { const t = +e.target.value; audio.currentTime = t; t0 = t; start = performance.now(); seek(t); $("tc").textContent = t.toFixed(2).padStart(5, "0"); };
}
</script>
