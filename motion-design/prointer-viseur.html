<script>
"use strict";
/* =====================================================================
   PRO-INTER — « Le viseur » — 31,6 s, 9:16, un seul plan-séquence nerveux.
   La cible du logo devient un viseur qui fonce d'info en info, calé sur une
   musique à 128 BPM, et laisse une traînée cyan. Les étapes sont posées sur
   une spirale autour d'une cible géante : le grand dézoom révèle la cible,
   puis le viseur plonge en son centre et devient le « O » du logo.
   ===================================================================== */
const Q = new URLSearchParams(location.search);
const W = 1080, H = 1920, DUR = 31.6;
const B = 60 / 128, bt = n => n * B;                  // temps de la n-ième pulsation (128 BPM)
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  out: t => 1 - Math.pow(1 - t, 3), in2: t => t * t,
  outExpo: t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t),
  outBack: t => { const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  outElastic: t => t === 0 || t === 1 ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * 2 * Math.PI / 3) + 1,
};
const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const WORLD = $("world"), CAM = $("cam"), SHAKE = $("shake");
function el(tag, at = {}, parent = WORLD) { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); parent.appendChild(e); return e; }
function set(e, at) { for (const k in at) e.setAttribute(k, typeof at[k] === "number" ? +at[k].toFixed(2) : at[k]); }
const C = { white: "#F4F7F8", cyan: "#00B8F8", grey: "#4A4A4A", dim: "#71808A", sub: "#8D9AA3", ring: "#1A2329", tile: "#131A1F", tileLine: "#27333B", tileOn: "#0A2D3A", dark: "#0E1215" };
const mixHex = (a, b, u) => "#" + [1, 3, 5].map(i => Math.round(lerp(parseInt(a.substr(i, 2), 16), parseInt(b.substr(i, 2), 16), u)).toString(16).padStart(2, "0")).join("");
const ICON = {
  helmet: "M3 17a9 9 0 0 1 18 0zM1 18h22v2H1zM10.5 6h3v5h-3z",
  gear: "M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L6.5 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1l.4 2.6h4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z",
  bolt: "M7 2v11h3v9l7-12h-4l4-8z",
  flame: "M12 2c1.2 3.4 4.8 5.4 4.8 10a4.8 4.8 0 0 1-9.6 0c0-2.2 1-3.6 2.2-4.6 0 2 .9 3.3 2.2 3.6C11 8.6 10.6 5 12 2z",
  check: "M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z",
  saw: "M19.73 14.23L7 1.5 3.11 5.39l8.13 11.67c-.78.78-.78 2.05 0 2.83l1.41 1.41c.78.78 2.05.78 2.83 0l4.24-4.24c.79-.78.79-2.05.01-2.83zm-5.66 5.65l-1.41-1.41 4.24-4.24 1.41 1.41-4.24 4.24z",
  key: "M12.65 10C11.83 7.67 9.61 6 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z",
  beam: "M4 3h16v4h-6v10h6v4H4v-4h6V7H4z",
  wrench: "M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z",
};
function icon(name, x, y, size, fill, parent) { const g = el("g", { transform: `translate(${x - size / 2},${y - size / 2}) scale(${size / 24})` }, parent); el("path", { d: ICON[name], fill }, g); return g; }

/* ---------------------------- typographie cinétique ---------------------------- */
// un mot centré sur son origine (pour l'échelle) ; y = centre des capitales
function word(parent, s, x, y, o) {
  const g = el("g", { opacity: 0 }, parent), ls = (o.ls ?? -.02) * o.size;
  const at = { x: 0, y: +(o.size * .355).toFixed(1), "font-size": o.size, "font-weight": o.w ?? 900, "text-anchor": "middle", "letter-spacing": +ls.toFixed(2) };
  const ghost = o.ghost ? el("text", { ...at, fill: C.cyan, opacity: 0 }, g) : null;
  const t = el("text", { ...at, fill: o.fill ?? C.white }, g);
  t.textContent = s; if (ghost) ghost.textContent = s;
  return { g, t, ghost, x, y, w: t.getComputedTextLength() - ls, size: o.size, fill: o.fill ?? C.white };
}
// une ligne de mots, réduite si elle dépasse o.max ; items = "MOTS" ou [["MOT", couleur], …]
function line(parent, items, x, y, o) {
  if (typeof items === "string") items = items.split(" ").map(s => [s]);
  let size = o.size;
  const make = () => items.map(([s, fill]) => word(parent, s, 0, y, { ...o, size, fill: fill ?? o.fill }));
  let ws = make();
  const gap = () => size * (o.gap ?? .27), total = () => ws.reduce((a, w) => a + w.w, 0) + gap() * (ws.length - 1);
  if (o.max && total() > o.max) { ws.forEach(w => w.g.remove()); size *= o.max / total(); ws = make(); }
  let cx = o.align === "l" ? x : x - total() / 2;
  ws.forEach(w => { w.x = cx + w.w / 2; cx += w.w + gap(); });
  ws.width = total(); return ws;
}
const fixed = ws => ws.forEach(w => set(w.g, { opacity: 1, transform: `translate(${w.x},${w.y})` }));
// apparitions : « slam » (claque depuis grand), « rise » (monte), « pop » (rebond)
function show(w, t, t0, kind = "rise", o = {}) {
  const d = o.d ?? (kind === "slam" ? .22 : .3), u = prog(t, t0, t0 + d), e = E.outExpo(u);
  let tf;
  if (kind === "slam") tf = `translate(${w.x},${w.y}) scale(${lerp(o.from ?? 1.9, 1, e)})`;
  else if (kind === "pop") tf = `translate(${w.x},${w.y}) scale(${Math.max(.001, E.outBack(u))})`;
  else tf = `translate(${w.x},${w.y + (1 - e) * (o.dy ?? w.size * .5)})`;
  set(w.g, { opacity: clamp(u * 6), transform: tf });
  if (w.ghost) set(w.ghost, { opacity: u > 0 ? (1 - e) * .9 : 0, transform: `translate(${(1 - e) * w.size * .2},${-(1 - e) * w.size * .07})` });
}
const hit = (w, t, tl, col = C.cyan) => w.t.setAttribute("fill", t >= tl ? col : w.fill);

/* ---------------------------- calques du monde ---------------------------- */
const L = {};
["grid", "rings", "trail", "center", "top", "st", "cur", "fx"].forEach(k => L[k] = el("g"));
const LD = window.LOGO_DATA, OL = LD.O;

// la spirale : 9 étapes de l'extérieur vers le centre, dans le sens des aiguilles d'une montre
// (angles choisis pour que le cadre final, autour du centre, reste vide de tout autre texte)
const ST = [-90, -15, 60, 135, 210, 285, 360, 400, 520].map((a, i) => { const th = a * Math.PI / 180, r = 3700 - 270 * i; return [r * Math.cos(th), r * Math.sin(th)]; });
const ZR = .115, CYR = -1739;                          // cadre du grand dézoom
const ZF = .8, CYF = 150;                              // cadre final
const T_R0 = bt(49), T_RV = bt(51.5), T_R1 = bt(53), T_LAND = bt(56);  // dézoom (puis la cible reste à l'écran), plongée, impact au centre
const LOCKS = [], ANIMS = [], STATIONS = [];
function lock(t, x, y, o = {}) { LOCKS.push({ t, x, y, d: o.d ?? .42, kind: o.kind ?? (o.arc ? "arc" : "line"), big: !!o.big, cam: o.cam || null }); }
let START, LOGO, CUR, TRAIL, FX = [], END = {};

function build() {
  /* fond : grille de points, anneaux de la cible géante, repères */
  el("rect", { x: -7000, y: -8200, width: 14000, height: 14400, fill: "url(#dots)" }, L.grid);
  [1150, 1750, 2400, 3050, 3700].forEach(r => el("circle", { r, fill: "none", stroke: C.ring, "stroke-width": 2.5, "vector-effect": "non-scaling-stroke" }, L.rings));
  el("circle", { r: 620, fill: "none", stroke: C.cyan, "stroke-width": 3, opacity: .7, "vector-effect": "non-scaling-stroke" }, L.rings);
  el("circle", { r: 4250, fill: "none", stroke: C.cyan, "stroke-width": 3, opacity: .55, "vector-effect": "non-scaling-stroke" }, L.rings);
  [[0, -1], [1, 0], [0, 1], [-1, 0]].forEach(([dx, dy]) => el("line", { x1: dx * 4050, y1: dy * 4050, x2: dx * 4620, y2: dy * 4620, stroke: C.cyan, "stroke-width": 4, opacity: .55, "vector-effect": "non-scaling-stroke" }, L.rings));

  /* 1 — l'accroche */
  { const [ax, ay] = ST[0], g = el("g", {}, L.st); STATIONS.push({ g, first: LOCKS.length });
    const l1 = line(g, "VOUS CHERCHEZ", ax, ay - 175, { size: 104, w: 800, max: 900 });
    const l2 = line(g, [["UN"], ["JOB", C.cyan], ["?"]], ax, ay + 45, { size: 250, max: 920, ghost: true });
    ANIMS.push(t => { show(l1[0], t, 0, "rise", { d: .35 }); show(l1[1], t, .12, "rise", { d: .35 }); show(l2[0], t, bt(1.5), "slam"); show(l2[1], t, bt(2), "slam"); show(l2[2], t, bt(2.5), "slam", { from: 2.6 }); });
    START = { x: l2[1].x, y: l2[1].y + 420 };
    lock(bt(2), l2[1].x, l2[1].y, { cam: [ax, ay - 40, .95], d: .5 }); }

  /* 2 — un vrai */
  { const [ax, ay] = ST[1], g = el("g", {}, L.st); STATIONS.push({ g, first: LOCKS.length });
    const l = line(g, "UN VRAI.", ax, ay, { size: 280, max: 920, ghost: true }), v = l[1];
    const x0 = v.x - v.w / 2, bar = el("rect", { x: x0, y: ay + v.size * .5, width: v.w, height: 24, rx: 4, fill: C.cyan }, g);
    ANIMS.push(t => { show(l[0], t, bt(4.2), "slam"); show(l[1], t, bt(4.5), "slam"); const s = E.outExpo(prog(t, bt(4.6), bt(4.6) + .35)); set(bar, { opacity: s > 0 ? 1 : 0, transform: `translate(${x0},0) scale(${Math.max(.001, s)},1) translate(${-x0},0)` }); });
    lock(bt(4.5), v.x, v.y, { cam: [ax, ay, 1], arc: true }); }

  /* 3 — près de chez vous */
  { const [ax, ay] = ST[2], g = el("g", {}, L.st); STATIONS.push({ g, first: LOCKS.length });
    const l1 = line(g, "PRÈS DE", ax, ay - 150, { size: 124, w: 800 });
    const l2 = line(g, [["CHEZ"], ["VOUS.", C.cyan]], ax, ay + 70, { size: 210, max: 920, ghost: true });
    ANIMS.push(t => { show(l1[0], t, bt(6) - .12); show(l1[1], t, bt(6) - .02); show(l2[0], t, bt(6.2), "slam"); show(l2[1], t, bt(6.5), "slam"); });
    lock(bt(6.5), l2[1].x, l2[1].y, { cam: [ax, ay - 30, 1], arc: true }); }

  /* 4 — chez PRO-INTER, on vise juste (le drop) */
  { const [ax, ay] = ST[3], g = el("g", {}, L.st); STATIONS.push({ g, first: LOCKS.length });
    const k = line(g, [["CHEZ"], ["PRO-INTER,", C.cyan]], ax, ay - 300, { size: 96, w: 800 });
    const l1 = line(g, "ON VISE", ax, ay - 70, { size: 210, max: 920, ghost: true });
    const J = line(g, "JUSTE.", ax, ay + 175, { size: 260, max: 920, ghost: true })[0];
    const tmp = word(g, "JUSTE", 0, 0, { size: J.size }), wNoDot = tmp.w; tmp.g.remove();
    const px = J.x - J.w / 2 + wNoDot + (J.w - wNoDot) * .42, py = J.y + J.size * .29;
    const rings = [0, 1, 2].map(() => el("circle", { cx: px, cy: py, r: 1, fill: "none", stroke: C.cyan, "stroke-width": 8, opacity: 0 }, g));
    ANIMS.push(t => { show(k[0], t, bt(7.7)); show(k[1], t, bt(8), "slam", { from: 2.4 }); show(l1[0], t, bt(9.6), "slam"); show(l1[1], t, bt(9.95), "slam"); show(J, t, bt(10.4), "slam"); hit(J, t, bt(11));
      rings.forEach((c, i) => { const u = prog(t, bt(11) + i * .07, bt(11) + i * .07 + .55); set(c, { r: 10 + E.outExpo(u) * (70 + i * 55), opacity: u > 0 && u < 1 ? (1 - u) : 0, "stroke-width": 9 - 6 * u }); }); });
    lock(bt(8), k[1].x, k[1].y, { cam: [ax, ay - 60, .95], arc: true, big: true, d: .45 });
    lock(bt(11), px, py, { cam: [ax + 50, ay + 80, 1.08], d: .3 }); }

  /* 5 — les contrats */
  { const [ax, ay] = ST[4], g = el("g", {}, L.st); STATIONS.push({ g, first: LOCKS.length });
    const kk = line(g, "VOS CONTRATS", ax, ay - 370, { size: 46, w: 700, fill: C.dim, ls: .3, gap: .6 });
    const P = ["INTÉRIM", "CDD", "CDI"].map((s, i) => { const y = ay - 170 + i * 205, pg = el("g", { opacity: 0 }, g);
      const r = el("rect", { x: -320, y: -80, width: 640, height: 160, rx: 80, fill: "none", stroke: "#2E3A42", "stroke-width": 6 }, pg);
      const w = word(pg, s, 0, 0, { size: 104 }); set(w.g, { opacity: 1 }); return { pg, r, w, x: ax, y, tl: bt([13, 15, 17][i]) }; });
    ANIMS.push(t => { kk.forEach((w, i) => show(w, t, bt(11.9) + i * .06));
      P.forEach((p, i) => { const u = E.outExpo(prog(t, bt(12) - .1 + i * .07, bt(12) + .25 + i * .07)), on = t >= p.tl, pu = 1 + .1 * Math.exp(-(t - p.tl) / .08) * on;
        set(p.pg, { opacity: clamp(u * 3), transform: `translate(${p.x},${p.y}) scale(${Math.max(.001, u) * pu},${pu})` });
        set(p.r, { fill: on ? C.cyan : "none", stroke: on ? C.cyan : "#2E3A42" }); p.w.t.setAttribute("fill", on ? C.dark : C.white); }); });
    P.forEach((p, i) => lock(p.tl, p.x, p.y, i ? { d: .22 } : { cam: [ax, ay - 50, 1], arc: true })); }

  /* 6 — profils qualifiés, puis les 6 secteurs */
  { const [ax, ay] = ST[5], g = el("g", {}, L.st); STATIONS.push({ g, first: LOCKS.length });
    const TP = [20, 23.5, 24.75], TS = [26.75, 28.75, 30.25, 32, 33.75, 35.25];   // tirs (pulsations), calés sur la voix
    const pq = line(g, [["PROFILS"], ["QUALIFIÉS", C.cyan]], ax, ay - 530, { size: 124, max: 900, ghost: true });
    const p1 = line(g, [["BÂTIMENT"], ["SECOND", C.cyan], ["ŒUVRE", C.cyan]], ax, ay - 390, { size: 88, max: 900, ghost: true });
    const p2 = line(g, [["ET"], ["INDUSTRIE", C.cyan]], ax, ay - 280, { size: 88, max: 900, ghost: true });
    const kk = line(g, "VOS SECTEURS", ax, ay - 120, { size: 46, w: 700, fill: C.dim, ls: .3, gap: .6 });
    const T = [["ÉLECTRICITÉ", "bolt"], ["CHAUFFAGE", "flame"], ["MENUISERIE", "saw"], ["SERRURERIE", "key"], ["MÉTALLERIE", "beam"], ["MAINTENANCE", "wrench"]].map(([s, ic], i) => {
      const x = ax + (i % 2 ? 228 : -228), y = ay + 60 + Math.floor(i / 2) * 300, tg = el("g", { opacity: 0 }, g);
      const r = el("rect", { x: -210, y: -135, width: 420, height: 270, rx: 28, fill: C.tile, stroke: C.tileLine, "stroke-width": 5 }, tg);
      const ig = el("g", {}, tg); icon(ic, 0, 0, 110, C.cyan, ig);
      fixed(line(tg, s, 0, 84, { size: 42, w: 800, max: 370 }));
      return { tg, r, ig, x, y, tl: bt(TS[i]) }; });
    ANIMS.push(t => { pq.forEach((w, i) => show(w, t, bt(TP[0]) - .38 * (1 - i), "slam"));
      p1.forEach((w, i) => show(w, t, bt([21.85, 22.6, 23.4][i]), "slam")); p2.forEach((w, i) => show(w, t, bt([24, 24.75][i]), "slam"));
      kk.forEach((w, i) => show(w, t, bt(TS[0]) - .55 + i * .06));
      T.forEach((o, i) => { const u = prog(t, bt(TS[0]) - .5 + i * .05, bt(TS[0]) - .1 + i * .05), on = t >= o.tl;
        set(o.tg, { opacity: clamp(u * 4), transform: `translate(${o.x},${o.y}) scale(${Math.max(.001, lerp(.6, 1, E.outBack(u)))})` });
        set(o.r, { fill: on ? C.tileOn : C.tile, stroke: on ? C.cyan : C.tileLine });
        const b = on ? 1 + .45 * (1 - E.outElastic(prog(t, o.tl, o.tl + .6))) : 1; set(o.ig, { transform: `translate(0,-36) scale(${b})` }); }); });
    lock(bt(TP[0]), pq[1].x, pq[1].y, { cam: [ax, ay - 340, 1], arc: true });
    lock(bt(TP[1]), p1[2].x, p1[2].y, { d: .3 });
    lock(bt(TP[2]), p2[1].x, p2[1].y, { d: .3 });
    T.forEach((o, i) => lock(o.tl, o.x, o.y - 36, i ? { d: .25 } : { cam: [ax, ay + 360, .9], d: .35 })); }

  /* 7 — écoute, trouve, suit */
  { const [ax, ay] = ST[6], g = el("g", {}, L.st), X0 = ax - 330; STATIONS.push({ g, first: LOCKS.length });
    const R = [[["ON"], ["ÉCOUTE.", C.cyan]], [["ON"], ["TROUVE.", C.cyan]], [["ON"], ["VOUS"], ["SUIT.", C.cyan]]];

  $("flash").style.opacity = (t >= T_LAND ? .32 * Math.exp(-(t - T_LAND) / .09) : t >= bt(8) ? .12 * Math.exp(-(t - bt(8)) / .07) : 0).toFixed(3);
}
window.seek = seek; window.DUR = DUR;

const render = Q.has("render");
if (render) document.body.classList.add("render");
Object.assign($("stage").style, { width: W + "px", height: H + "px" });
window.ready = (async () => { for (const w of [600, 700, 800, 900]) await document.fonts.load(`${w} 40px "Montserrat"`); await document.fonts.ready; build(); camSteps(); STATIONS.forEach((S, i) => { const nx = STATIONS[i + 1]; S.out = nx ? LOCKS[nx.first].t - LOCKS[nx.first].d : T_R0; }); seek(0); return true; })();
if (!render) {
  const fit = () => { const s = Math.min(innerWidth / W, (innerHeight - 70) / H); $("stage").style.transform = `scale(${s})`; };
  addEventListener("resize", fit); fit();
  const audio = new Audio("out/prointer-viseur-mix.wav"); let playing = false, t0 = 0, start = 0;
  const tick = () => { if (!playing) return; let t = audio.readyState > 2 && !audio.paused ? audio.currentTime : (performance.now() - start) / 1000 + t0; if (t >= DUR) { playing = false; t = DUR; $("play").textContent = "▶ Lecture"; } seek(t); $("scrub").value = t; $("tc").textContent = t.toFixed(2).padStart(5, "0"); requestAnimationFrame(tick); };
  $("play").onclick = () => { playing = !playing; $("play").textContent = playing ? "❚❚ Pause" : "▶ Lecture"; if (playing) { t0 = +$("scrub").value; if (t0 >= DUR - .05) t0 = 0; start = performance.now(); audio.currentTime = t0; audio.play().catch(() => {}); tick(); } else audio.pause(); };
  $("scrub").oninput = e => { const t = +e.target.value; audio.currentTime = t; t0 = t; start = performance.now(); seek(t); $("tc").textContent = t.toFixed(2).padStart(5, "0"); };
}
