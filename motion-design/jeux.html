    const s2 = proj(c, ...SCREEN); if (s2) flare(fx, s2[0], s2[1], bell(t, 3.3, 3.85, 4.3) * 1.1, 1100); }

  // 1 : GTA — le trajet du point A au Mont Chiliad
  {
    const a = win(t, 8.9, 9.4, 13.9, 14.3);
    if (a > 0) {
      const pts = ROUTE_FINE.map(([u, v]) => proj(c, ...W_("la", u, v))).filter(Boolean);
      const drawn = E.inOut(prog(t, 9.3, 13.1)), n = Math.max(2, Math.round(drawn * (pts.length - 1)) + 1);
      glowPath(fx, pts, a * 0.35, 3, [2, 16]);
      glowPath(fx, pts.slice(0, n), a, 4.5);
      const head = pts[n - 1]; if (head && drawn < 1) spark(fx, head[0], head[1], 26, a);
      const A = proj(c, ...W_("la", ...ROUTE[0])), B = proj(c, ...W_("la", ...ROUTE[ROUTE.length - 1]));
      if (A) pin(fx, A[0], A[1], 1.05, a * E.outBack(prog(t, 9.1, 9.5)), "POINT A");
      if (B) { pin(fx, B[0], B[1], 1.15, a * E.outBack(prog(t, 12.9, 13.3)), "MONT CHILIAD"); flare(fx, B[0], B[1] - 50, bell(t, 13.0, 13.15, 13.8), 900); }
      // les viewers interviennent : explosion sur la route, téléportation
      const X = proj(c, ...W_("la", 0.47, 0.67)); if (X) explosion(fx, X[0], X[1], t, 12.0, 0.8 * X[2] * 1.6, 3);
      const T = proj(c, ...W_("la", 0.36, 0.73)); if (T) warp(fx, T[0], T[1], t, 11.35, X ? X[2] * 1.6 : 1);
    }
  }
  // 2 : Minecraft — la TNT explose sur la tour
  { const q = proj(c, ...W_("tnt", 0.43, 0.42)); if (q) { explosion(fx, q[0], q[1], t, 16.95, 1.3, 7, true); flare(fx, q[0], q[1], bell(t, 16.9, 16.97, 17.5), 1100); } }
  // 3 : Roblox — reflets sur les cartes qui arrivent
  RB.forEach((k, i) => { const q = proj(c, ...W_(k, 0.5, 0.15)); if (q) flare(fx, q[0], q[1], bell(t, 19.05 + i * 0.32, 19.15 + i * 0.32, 19.6 + i * 0.32) * .6, 600); });
  // 6 : sur demande — chaque tuile s'allume
  DJ.forEach((k, i) => { const q = proj(c, ...W_(k, 0.5, 0.5)); if (q) burst(fx, q[0], q[1], t, P[k].pop, 16, 260, 40 + i); });

  // effets en espace écran (au-dessus des textes et des cartes)
  fx2.setTransform(1, 0, 0, 1, 0, 0);
  floaters(fx2, t, 1.6, 3.6, 900, 1500, 12, 3, "heart");
  floaters(fx2, t, 2.2, 3.6, 880, 1560, 5, 9, "gift");
  RULES.forEach((R, r) => {
    const yc = R.y + 36, xr = 700;
    if (r === 0) floaters(fx2, t, R.t0, R.t0 + 0.6, 260, yc, 9, 21, "heart");
    if (r === 1) { floaters(fx2, t, R.t0, R.t0 + 0.4, 260, yc, 4, 23, "gift"); explosion(fx2, xr + 120, yc, t, R.t0 + 0.38, 0.55, 11); }
    if (r === 2) warp(fx2, xr + 120, yc, t, R.t0 + 0.38, 0.9);
  });
  ROWS.forEach(row => row.cards.forEach((cd, i) => { const el = cd.el, x = parseFloat(el.style.left) + parseFloat(el.style.width) / 2, y = parseFloat(el.style.top) + 20; burst(fx2, x, y, t, cd.t0 + 0.05, 18, 300, 60 + i); }));
  // écran rouge du screamer
  burst(fx2, W / 2, 900, t, 26.8, 70, 900, 77, ["#FFE0D0", "#FF5A4E"]);
  burst(fx2, W / 2, lpx(0, 900)[1], t, IMP, 80, 900, 9);
}

function drawHud(t) {
  // principe : interaction → action
  RULES.forEach((R, r) => {
    const out = 1 - E.out(prog(t, 8.0, 8.35)), ua = E.outBack(prog(t, R.t0, R.t0 + 0.4)), ub = E.outBack(prog(t, R.t0 + 0.35, R.t0 + 0.75));
    const aw = R.a.offsetWidth, bw = R.b.offsetWidth, gapA = 70, total = aw + gapA + bw, x0 = (W - total) / 2;
    R.a.style.opacity = (clamp(ua * 2) * out).toFixed(3); R.a.style.transform = `translate(${x0}px,${R.y}px) scale(${(0.8 + 0.2 * ua).toFixed(3)})`;
    R.b.style.opacity = (clamp(ub * 2) * out).toFixed(3); R.b.style.transform = `translate(${x0 + aw + gapA}px,${R.y}px) scale(${(0.8 + 0.2 * ub).toFixed(3)})`;
    const ar = E.inOut(prog(t, R.t0 + 0.2, R.t0 + 0.45)) * out;
    if (ar > 0) { const y = R.y + R.a.offsetHeight / 2, xa = x0 + aw + 10, xb = xa + (gapA - 20) * ar; fx2.globalAlpha = ar; fx2.strokeStyle = "#F0C066"; fx2.lineWidth = 3; fx2.lineCap = "round";
      fx2.beginPath(); fx2.moveTo(xa, y); fx2.lineTo(xb, y); fx2.moveTo(xb - 10, y - 9); fx2.lineTo(xb, y); fx2.lineTo(xb - 10, y + 9); fx2.stroke(); fx2.globalAlpha = 1; }
  });
  // rangées de cartes du guide
  ROWS.forEach(row => {
    const out = 1 - E.out(prog(t, row.t1, row.t1 + 0.35));
    row.cards.forEach(cd => { const u = prog(t, cd.t0, cd.t0 + 0.45), e = E.outBack(u); cd.el.style.opacity = (clamp(u * 2.5) * out).toFixed(3); cd.el.style.transform = `translateY(${((1 - E.out(u)) * 40).toFixed(1)}px) scale(${(0.7 + 0.3 * e).toFixed(3)})`; });
    row.hs.forEach(h => { const u = prog(t, h.t0, h.t0 + 0.4); h.el.style.opacity = (E.out(u) * out).toFixed(3); h.el.style.transform = `translateY(${((1 - E.out(u)) * 16).toFixed(1)}px)`; });
  });
}

function drawText(t) {
  for (const T of TEXTS) {
    const outU = prog(t, T.t1, T.t1 + T.out);
    T.spans.forEach((s, i) => {
      const u = prog(t, T.t0 + i * T.stag, T.t0 + i * T.stag + T.dur), e = E.out(u);
      s.style.opacity = (e * (1 - E.sine(outU))).toFixed(3);
      s.style.transform = `translateY(${((1 - e) * 34).toFixed(2)}px)`;
      const blur = (1 - E.out4(u)) * 12 + outU * 10; s.style.filter = blur > .05 ? `blur(${blur.toFixed(2)}px)` : "none";
    });
    if (T.fly) { const sc = 1 + E.in2(prog(t, 3.3, 3.95)) * 2.6, yOff = (parseFloat(T.el.style.top) - H / 2) * (sc - 1); T.el.style.transform = `translateX(-50%) translateY(${yOff.toFixed(1)}px) scale(${sc.toFixed(3)})`; }
  }
}

const TRANS = [[4.05, 0.5], [8.55, 0.45], [14.35, 0.45], [18.95, 0.45], [23.6, 0.5], [28.6, 0.5], [32.2, 0.45]];
function drawOverlays(t, c) {
  let k = 0, bx = W / 2, by = H / 2;
  for (const [tc, hw] of TRANS) { const b = bell(t, tc - hw, tc, tc + hw); if (b > k) { k = b; bx = W / 2; by = H / 2; if (tc < 5) { const q = proj(c, ...SCREEN); if (q) { bx = q[0]; by = q[1]; } } } }
  const R = Math.max(W, H);
  $("bloom").style.opacity = k.toFixed(3);
  $("bloom").style.background = `radial-gradient(circle ${R}px at ${bx.toFixed(0)}px ${by.toFixed(0)}px, rgba(255,248,230,1) 0%, rgba(255,226,165,.92) ${(18 + 40 * k).toFixed(0)}%, rgba(214,150,60,.55) ${(45 + 40 * k).toFixed(0)}%, rgba(120,70,20,${(.3 * k).toFixed(2)}) 100%)`;
  const lk = Math.max(bell(t, 9.4, 10.0, 10.8), bell(t, 20.0, 20.8, 21.8), bell(t, 29.6, 30.3, 31.2)) * .3, lx = ((t * 260) % (W + 700)) - 350;
  $("leak").style.opacity = lk.toFixed(3);
  $("leak").style.background = `radial-gradient(ellipse 500px 1300px at ${lx.toFixed(0)}px 40%, rgba(255,180,80,.55), rgba(255,140,40,0) 70%)`;
  // horreur : voile rouge, coupure de courant, flash du screamer
  $("tint").style.opacity = (win(t, 23.7, 24.4, 28.2, 28.6) * 0.32).toFixed(3);
  $("hookback").style.opacity = (win(t, 0.3, 1.0, 3.3, 3.7)).toFixed(3);
  $("dark").style.opacity = (bell(t, 26.0, 26.12, 26.45) * 0.85).toFixed(3);
  const fl = Math.max(prog(t, IMP - .03, IMP + .6) > 0 && t < IMP + .6 ? Math.pow(1 - prog(t, IMP - .03, IMP + .6), 2.2) : 0, 0);
  const scr = bell(t, 26.75, 26.8, 27.15) * 0.7, tnt = bell(t, 16.9, 16.95, 17.35) * 0.6, gta = bell(t, 12.0, 12.05, 12.4) * 0.35;
  const fa = Math.max(fl, scr, tnt, gta);
  $("flash").style.opacity = fa.toFixed(3);
  const col = scr >= fa && scr > 0 ? "255,90,70" : "255,246,222";
  $("flash").style.background = `radial-gradient(circle ${R}px at ${LCX}px ${fl >= fa ? lpx(0, 900)[1].toFixed(0) : 900}px, rgba(${col},.95) 0%, rgba(240,190,100,.55) 18%, rgba(160,100,30,.12) 45%, rgba(0,0,0,0) 70%)`;
  const sc = Math.max(...SECTIONS.map(s => bell(t, s[3] - 0.1, s[3] + 0.5, s[4] + 0.6)));
  $("scrim").style.opacity = sc.toFixed(3);
  $("fade").style.opacity = Math.max(1 - E.out(prog(t, 0, 1.0)), E.in(prog(t, 43.3, 44))).toFixed(3);
}

function drawLogo(t) {
  const fill = prog(t, IMP - .05, IMP + .14);
  LOGO.icon.style.opacity = E.out(fill).toFixed(3); LOGO.icon.style.transformOrigin = "50% 100%";
  LOGO.icon.style.transform = `scale(${(1 + .06 * (1 - E.out(prog(t, IMP, IMP + .8)))).toFixed(4)})`;
  const sw = prog(t, IMP + .5, IMP + 1.4); LOGO.sweep.style.opacity = sw > 0 && sw < 1 ? 1 : 0; LOGO.sweep.style.backgroundPosition = `${(100 - sw * 100).toFixed(2)}% 0`;
  const rev = (el, a, b, mode, ease = E.inOut) => {
    const u = ease(prog(t, a, b)); el.style.opacity = u > 0 ? 1 : 0;
    if (mode === "lr") { const X = -15 + u * 130; el.style.webkitMaskImage = el.style.maskImage = `linear-gradient(90deg,#000 ${X - 15}%,transparent ${X}%)`; }
    else { const X = u * 62; el.style.webkitMaskImage = el.style.maskImage = `linear-gradient(90deg,transparent ${50 - X - 12}%,#000 ${50 - X}%,#000 ${50 + X}%,transparent ${50 + X + 12}%)`; }
    el.style.transform = `translateY(${((1 - E.out(prog(t, a, b))) * 14).toFixed(2)}px)`;
  };
  rev(LOGO.empira, IMP + .35, IMP + 1.4, "lr"); rev(LOGO.agency, IMP + .8, IMP + 1.8, "c"); rev(LOGO.tagline, IMP + 1.3, IMP + 2.5, "c");
  CTA.forEach(({ el, t0 }) => { const u = E.out(prog(t, t0, t0 + 0.8)); el.style.opacity = u.toFixed(3); el.style.transform = `translateX(-50%) translateY(${((1 - u) * 18).toFixed(1)}px)`; el.style.filter = u < 1 ? `blur(${((1 - u) * 8).toFixed(2)}px)` : "none"; });
}

function drawGrain(frame) { const r = rng(frame * 7919 + 13), d = grainImg.data; for (let i = 0; i < d.length; i += 4) { const v = r() * 255; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; } gc.putImageData(grainImg, 0, 0); }

function seek(t) { const c = camera(t); drawBg(t); drawPlanes(t, c); drawFx(t, c); drawHud(t); drawText(t); drawOverlays(t, c); drawLogo(t); drawGrain(Math.floor(t * 30)); }
window.seek = seek; window.DUR = DUR;

const render = Q.has("render");
if (render) document.body.classList.add("render");
window.ready = (async () => {
  await document.fonts.load('300 40px "Montserrat"'); await document.fonts.load('400 40px "Montserrat"'); await document.fonts.load('500 40px "Montserrat"'); await document.fonts.load('600 40px "Montserrat"'); await document.fonts.ready;
  await Promise.all([...document.images].map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })));
  await Promise.all([...document.images].map(im => im.decode ? im.decode().catch(() => 0) : 0));
  seek(0); return true;
})();
if (!render) {
  const fit = () => { const s = Math.min(innerWidth / W, (innerHeight - 70) / H); $("stage").style.transform = `scale(${s})`; };
  addEventListener("resize", fit); fit();
  const audio = new Audio("out/jeux-mix.wav"); let playing = false, t0 = 0, start = 0;
  const tick = () => { if (!playing) return; let t = audio.readyState > 2 && !audio.paused ? audio.currentTime : (performance.now() - start) / 1000 + t0; if (t >= DUR) { playing = false; t = DUR; $("play").textContent = "▶ Lecture"; } seek(t); $("scrub").value = t; $("tc").textContent = t.toFixed(2).padStart(5, "0"); requestAnimationFrame(tick); };
  $("play").onclick = () => { playing = !playing; $("play").textContent = playing ? "❚❚ Pause" : "▶ Lecture"; if (playing) { t0 = +$("scrub").value; if (t0 >= DUR - .05) t0 = 0; start = performance.now(); audio.currentTime = t0; audio.play().catch(() => {}); tick(); } else audio.pause(); };
  $("scrub").oninput = e => { const t = +e.target.value; audio.currentTime = t; t0 = t; start = performance.now(); seek(t); $("tc").textContent = t.toFixed(2).padStart(5, "0"); };
}
</script>
